name: Build Windows ARM64 (vendored fork)

# Self-repairing build of the vendored fork source at repo root.
# The build steps themselves are deterministic and live in
# .github/actions/arm64-build (thin shims over scripts/) — this file only
# orchestrates a bounded attempt/repair loop:
#
#   build-attempt-1 ──fail──> repair-1 (Opus 5) ──> build-attempt-2
#                                   ──fail──> repair-2 (Opus 5) ──> build-attempt-3
#
# Max 3 build attempts / 2 AI repairs, then verdict fails LOUD. Every repair
# is pushed to the repair branch (nightly candidate, or the dispatched branch
# for manual runs) and the next attempt builds that exact sha, so every
# deterministic gate re-runs on the repaired tree. (BUILD-REPAIR)
#
# Why the split matters: workflow YAML is frozen when a run starts and
# GITHUB_TOKEN cannot push .github/workflows changes — but .github/actions/**
# and scripts/** are ordinary repo files, checked out per attempt, so the
# repair AI can fix ~everything mid-run. Workflow-YAML fixes need the
# WORKFLOW_PUSH_TOKEN secret (fine-grained PAT, Contents+Workflows write) and
# take effect the NEXT run.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the desktop-v<version> Release (rebuilt in place; one version, no beta)'
        type: boolean
        default: true
      repair_branch:
        description: 'Branch AI repairs are pushed to (default: the dispatched branch)'
        type: string
        default: ''
  # Reusable so nightly-merge.yml can invoke the exact same build.
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      ref:
        description: 'Git ref to build (default: the triggering ref)'
        type: string
        default: ''
      repair_branch:
        description: 'Branch AI repairs are pushed to (nightly passes the candidate)'
        type: string
        default: ''
    outputs:
      built_sha:
        description: 'The exact commit the successful attempt built (differs from the input ref when a repair landed)'
        value: ${{ jobs.verdict.outputs.built_sha }}

permissions:
  contents: write
  actions: read # repair jobs download this run's failed-job logs

jobs:
  build-attempt-1:
    runs-on: windows-11-arm
    timeout-minutes: 180
    # Failures are handled by the repair loop; verdict is the single source of
    # truth for the workflow result. (Job-level continue-on-error masks the
    # failure in `needs.*.result`, so the loop keys off the `ok` OUTPUT — only
    # a fully green attempt sets it.)
    continue-on-error: true
    outputs:
      ok: ${{ steps.done.outputs.ok }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Superset has paths deeper than Windows' 260-char MAX_PATH; without this
      # actions/checkout dies with "Filename too long". Must run BEFORE
      # checkout, so it cannot live in the composite action.
      - name: Configure git long paths (Windows MAX_PATH)
        shell: bash
        run: git config --system core.longpaths true || git config --global core.longpaths true
      # A direct dispatch's repair loop pushes to a live branch; racing a
      # nightly's candidate/advance would fail that nightly loudly (non-ff) —
      # refuse up front instead. Only guards direct dispatches: when called
      # from nightly-merge, github.workflow is the CALLER's name.
      - name: Direct-dispatch mutex — refuse while a nightly is active
        if: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Build Windows ARM64 (vendored fork)' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE=$(gh run list --repo "${{ github.repository }}" --workflow nightly-merge.yml --limit 50 --json databaseId,status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="requested" or .status=="pending")] | length')
          if [ "$ACTIVE" != "0" ]; then
            echo "::error::(BUILD-REPAIR) a nightly-merge run is in progress/queued — a direct build's repairs could race its candidate/advance. Retry after it finishes."
            exit 1
          fi
      - name: Checkout fork source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - name: Record built sha
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build, package, verify
        uses: ./.github/actions/arm64-build
        with:
          gh-token: ${{ github.token }}
      # (CLOUD-SEVERANCE-P1) THE severance enforcement point. It lives in the
      # WORKFLOW, not in .github/actions/arm64-build, because a workflow file is
      # frozen for the whole run: a mid-run (BUILD-REPAIR) agent can rewrite the
      # composite action and scripts/, but it cannot touch these lines for this
      # run. The composite action runs the gate too, for fast feedback; THIS is
      # the step that decides, and it is deliberately not skippable — no `if:`,
      # no `continue-on-error`, and the run block below must stay a bare
      # invocation (no `|| true`, no `echo`) or it stops enforcing anything.
      #
      # The gate must both EXIT 0 and leave a stamp proving which tree it
      # validated and how many assertions actually executed. The stale stamp is
      # deleted first so a stamp forged by a repair-added step earlier in the
      # job cannot satisfy this check.
      - name: Enforce cloud severance (frozen — cannot be repaired away)
        shell: bash
        env:
          BUILT_SHA: ${{ steps.sha.outputs.sha }}
          # (CI-INTEGRITY) Step-level `env:` has the HIGHEST precedence in the
          # runner's env layering — it is applied after anything an earlier step
          # wrote to $GITHUB_ENV. Pinning these to empty here is the only real
          # PREVENTION available, because bash sources $BASH_ENV before the
          # first line of the run block below: a repairable step that put
          # BASH_ENV=<path> into $GITHUB_ENV would otherwise get its own code
          # executed inside this frozen step's shell, where a bare `exit 0`
          # ends the gate before it starts. NODE_OPTIONS is already in the
          # runner's own _setEnvBlockList; BASH_ENV, ENV and NODE_PATH are not,
          # which is why the one variable that was handled was the one that
          # could not have been set anyway.
          BASH_ENV: ''
          ENV: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          set -euo pipefail
          # Belt and braces behind the step-level pinning above. Reaching this
          # line with BASH_ENV/ENV non-empty would mean the precedence
          # assumption failed AND foreign code already ran in this shell, so it
          # is reported as tampering rather than quietly cleaned up. (An
          # attacker whose sourced file exits 0 is never seen here at all —
          # prevention is the env block, this is detection.)
          if [ -n "${BASH_ENV:-}" ] || [ -n "${ENV:-}" ]; then
            echo "::error::(CLOUD-SEVERANCE-P1) BASH_ENV/ENV is set on entry to the frozen enforcement step (BASH_ENV='${BASH_ENV:-}' ENV='${ENV:-}'). Bash sources that file before this step's first line, so an earlier repairable step tried to run code inside the gate's own shell. Treating this as tampering. Refusing to publish."
            exit 1
          fi
          # Everything before this step in the job runs from the REPAIRABLE
          # composite action, and a step can persist state to $GITHUB_PATH and
          # $GITHUB_ENV that later steps inherit. So this frozen step must not
          # inherit an interpreter or its options from that state: NODE_OPTIONS
          # can inject --require, NODE_PATH can redirect module resolution, and
          # a poisoned PATH can shadow `node` itself.
          unset BASH_ENV ENV NODE_OPTIONS NODE_PATH
          # Fixed absolute PATH. $GITHUB_PATH prepends whatever an earlier
          # repairable step asked for, and that would otherwise decide what
          # `rm` means here and what `git` and `7z` mean inside the gate (it
          # shells out to git for the sha it stamps, and to 7-Zip to extract
          # the published installer). No fallback to the inherited PATH:
          # a missing tool fails loud instead.
          export PATH="/c/Program Files/Git/usr/bin:/c/Program Files/Git/mingw64/bin:/c/Program Files/Git/bin:/c/Program Files/Git/cmd:/c/Program Files/7-Zip:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem"
          for tool in git rm; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::(CLOUD-SEVERANCE-P1) '$tool' does not resolve on the pinned PATH ($PATH) — refusing to fall back to the inherited PATH, which an earlier repairable step can poison. Fix the pinned PATH in this frozen step."
              exit 1
            }
          done
          NODE_BIN=""
          for candidate in \
            "/c/Program Files/nodejs/node.exe" \
            "$RUNNER_TOOL_CACHE"/node/*/arm64/node.exe \
            "$RUNNER_TOOL_CACHE"/node/*/x64/node.exe
          do
            if [ -x "$candidate" ]; then NODE_BIN="$candidate"; break; fi
          done
          if [ -z "$NODE_BIN" ]; then
            echo "::error::(CLOUD-SEVERANCE-P1) no node found at a trusted absolute path — refusing to resolve node from PATH, which an earlier repairable step can poison."
            exit 1
          fi
          echo "using node: $NODE_BIN ($("$NODE_BIN" --version))"
          rm -f .fork/cloud-severance-stamp.json
          "$NODE_BIN" scripts/check-cloud-severance.mjs
          # The verifier below is passed to node as a SINGLE-quoted shell
          # argument, and it therefore uses double quotes internally and
          # contains no apostrophe anywhere — not even in a comment.
          #
          # This is not style. It was written as a DOUBLE-quoted argument with
          # single-quoted JS inside, and one explanatory comment contained the
          # phrase "exactly the expected assertion set ran" — whose quotes
          # closed the shell string. Bash then word-split the remainder into
          # argv, node executed only the fragment before it, and exited 0. The
          # sha and mode checks happened to sit before that point and survived;
          # the assertion-count check sat after it and NEVER RAN. A gate whose
          # verifier can be silently truncated by punctuation is not a gate.
          #
          # So: keep the prose out here in shell comments where quoting cannot
          # bite, keep the JS quote-free, and — because neither rule is
          # self-enforcing — make the verifier PROVE it reached its own last
          # line. The marker check below is what makes a future recurrence
          # loud instead of silent.
          #
          # EXPECTED = 38 = 21 source/dist assertions + 8 over the PACKAGED
          # app.asar + 8 over the asar EXTRACTED FROM THE PUBLISHED INSTALLER
          # + 1 app-update.yml check inside that installer. The source/dist
          # figure grew from 11 to 21 with (CLOUD-SEVERANCE-P2): 7 cloud-origin
          # absence checks, better-auth's HTTP routes, the POSITIVE
          # egress-fence FENCE-BLOCK marker check, and the CSP websocket-scope
          # check. The installer set is
          # the load-bearing one: the .exe is the only file
          # publish-arm64-release.sh uploads, and a repair could scrub the
          # unpacked asar AFTER the .exe was built from it.
          #
          # LOCKSTEP: that constant is duplicated in all THREE enforcement steps
          # in this file (build-attempt-1/2/3). Growing the gate means updating
          # every copy in the same commit; a partial update makes the attempts
          # disagree and the ones left behind refuse to publish. Deliberate --
          # the count is the only thing proving the gate that ran is the gate
          # this file vouches for. Equality, not a floor: fewer means the gate
          # was weakened, more means it grew without this frozen check being
          # updated, and an unreviewed assertion set is not the one this check
          # vouches for.
          VERIFY_OUT=$("$NODE_BIN" -e '
            const fs = require("fs");
            const p = ".fork/cloud-severance-stamp.json";
            if (!fs.existsSync(p)) {
              console.error("::error::(CLOUD-SEVERANCE-P1) gate exited 0 but wrote no stamp — it did not really run. Refusing to publish.");
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const want = process.env.BUILT_SHA;
            if (s.sha !== want) {
              console.error("::error::(CLOUD-SEVERANCE-P1) stamp validated sha " + s.sha + " but this job built " + want + ". Refusing to publish.");
              process.exit(1);
            }
            if (s.mode !== "full") {
              console.error("::error::(CLOUD-SEVERANCE-P1) stamp mode is " + s.mode + ", not full — the artifact assertions were skipped. Refusing to publish.");
              process.exit(1);
            }
            const EXPECTED = 38;
            if (s.assertionsPassed !== EXPECTED) {
              console.error("::error::(CLOUD-SEVERANCE-P2) stamp reports " + s.assertionsPassed + " assertions, expected exactly " + EXPECTED + " — either the gate was weakened, or it grew and the EXPECTED constant was not updated in ALL THREE enforcement steps of this workflow in lockstep. Refusing to publish.");
              process.exit(1);
            }
            console.log("(CLOUD-SEVERANCE-P1) stamp verified: sha=" + s.sha + " assertions=" + s.assertionsPassed + " mode=" + s.mode);
            console.log("STAMP-VERIFIER-REACHED-END");
          ')
          printf '%s\n' "$VERIFY_OUT"
          case "$VERIFY_OUT" in
            *STAMP-VERIFIER-REACHED-END*) ;;
            *)
              echo "::error::(CLOUD-SEVERANCE-P1) the stamp verifier exited 0 without printing its end-of-script marker, so it did not run to completion — most likely its script was truncated by a quoting change and node executed only a fragment. Every check after the truncation point silently did not happen. Refusing to publish."
              exit 1
              ;;
          esac
      # Publishing moved OUT of the composite action so that it sits AFTER the
      # frozen enforcement step above. It used to be the action's last step,
      # which meant a repair that neutered the action's own severance check
      # would have published the Release before anything frozen could object.
      # Now a failed enforcement simply means this step never runs.
      - name: Publish GitHub Release
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-arm64-release.sh
      - name: Mark attempt green
        id: done
        shell: bash
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  repair-1:
    needs: build-attempt-1
    if: ${{ !cancelled() && needs.build-attempt-1.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      repaired: ${{ steps.repair.outputs.repaired }}
      sha: ${{ steps.repair.outputs.sha }}
    steps:
      # persist-credentials:false — the AI step must run credential-less
      # (build logs are untrusted input to it); the push step uses an
      # ephemeral URL-embedded token instead.
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.repair_branch || github.ref_name }}
          fetch-depth: 50
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # (CI-INTEGRITY) Recorded BEFORE the AI step, as a step OUTPUT rather than
      # a file: the runner owns step outputs, so an agent with shell access
      # cannot rewrite this the way it could a path under the workspace or
      # $RUNNER_TEMP. It anchors both the trusted validator extracted below and
      # every base-vs-head comparison that validator makes.
      - name: Record pre-repair sha (frozen)
        id: prerepair
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Collect failure evidence
        shell: bash
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build-attempt-1.outputs.sha }}
          REPAIR_BRANCH: ${{ inputs.repair_branch || github.ref_name }}
        run: bash scripts/ci-repair.sh collect
      - name: AI repair round 1 (credential-less)
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROUND: '1'
          REPAIR_BRANCH: ${{ inputs.repair_branch || github.ref_name }}
        run: bash scripts/ci-repair.sh agent
      - name: Validate + push repair
        id: repair
        shell: bash
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ROUND: '1'
          REPAIR_BRANCH: ${{ inputs.repair_branch || github.ref_name }}
          PUSH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' && secrets.WORKFLOW_PUSH_TOKEN || github.token }}
          HAS_WORKFLOW_PAT: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' }}
          TRUSTED_BASE_SHA: ${{ steps.prerepair.outputs.sha }}
          # (CI-INTEGRITY) This step holds PUSH_TOKEN and runs immediately after
          # the agent step, which has unrestricted shell access. Pinning the
          # interpreter env at step level (highest precedence, applied after
          # $GITHUB_ENV) is what stops the agent from having its own code
          # sourced into this shell via BASH_ENV before the first line below —
          # a shell that could push arbitrary content, write repaired=true to
          # $GITHUB_OUTPUT, exit 0, and exfiltrate the PAT. Pinning the
          # validator's BYTES (below) is worthless if the environment those
          # bytes execute in is attacker-controlled.
          BASH_ENV: ''
          ENV: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
        # (CI-INTEGRITY) Run the PRE-AGENT copy of the validator, not the one in
        # the working tree the agent just edited. ci-repair.sh is a frozen path,
        # but the check that enforces that freeze lives INSIDE ci-repair.sh — so
        # an agent that rewrote it would have been judged by its own rewrite.
        # Extracting the blob at the recorded pre-repair sha makes the executing
        # bytes trusted; the freeze check then still fails the repair for having
        # touched the file. ai-run.sh comes too because ci-repair.sh sources it
        # relative to its own location.
        run: |
          set -euo pipefail
          # Detection behind the step-level env pinning above; see B2 note there
          # for why prevention has to happen before this shell starts.
          if [ -n "${BASH_ENV:-}" ] || [ -n "${ENV:-}" ]; then
            echo "::error::(CI-INTEGRITY) BASH_ENV/ENV is set on entry to the validate+push step (BASH_ENV='${BASH_ENV:-}' ENV='${ENV:-}') — bash sources that file before this step's first line, so the credential-less agent step tried to run code inside the shell that holds PUSH_TOKEN. Treating this as tampering. Refusing to push."
            exit 1
          fi
          unset BASH_ENV ENV NODE_OPTIONS NODE_PATH
          # Fixed absolute PATH. The agent can write $GITHUB_PATH, and every
          # tool this step and the trusted validator depend on — git, node,
          # python3, base64, diff, grep — would otherwise be attacker-resolved
          # inside a shell holding the workflow-scoped PAT. No fallback: a tool
          # missing from the pinned PATH fails loud (closed) rather than
          # silently resolving through the inherited one. This shadows
          # setup-node's tool-cache node; the system node is sufficient here and
          # $RUNNER_TOOL_CACHE is agent-writable, so it is deliberately not used.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          for tool in bash git node python3 base64 diff grep sed; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::(CI-INTEGRITY) '$tool' does not resolve on the pinned PATH ($PATH) — refusing to fall back to the inherited PATH, which the agent step can poison. Add its directory to the pinned PATH in this frozen step."
              exit 1
            }
          done
          TRUSTED_DIR="$RUNNER_TEMP/ci-repair-trusted-$ROUND"
          rm -rf "$TRUSTED_DIR" && mkdir -p "$TRUSTED_DIR"
          /usr/bin/git show "$TRUSTED_BASE_SHA:scripts/ci-repair.sh" > "$TRUSTED_DIR/ci-repair.sh"
          /usr/bin/git show "$TRUSTED_BASE_SHA:scripts/ai-run.sh"    > "$TRUSTED_DIR/ai-run.sh"
          /bin/bash "$TRUSTED_DIR/ci-repair.sh" push

  build-attempt-2:
    needs: [build-attempt-1, repair-1]
    if: ${{ !cancelled() && needs.repair-1.outputs.repaired == 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 180
    continue-on-error: true
    outputs:
      ok: ${{ steps.done.outputs.ok }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Configure git long paths (Windows MAX_PATH)
        shell: bash
        run: git config --system core.longpaths true || git config --global core.longpaths true
      - name: Checkout repaired source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.repair-1.outputs.sha }}
          fetch-depth: 1
      - name: Record built sha
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build, package, verify
        uses: ./.github/actions/arm64-build
        with:
          gh-token: ${{ github.token }}
      # (CLOUD-SEVERANCE-P1) THE severance enforcement point. It lives in the
      # WORKFLOW, not in .github/actions/arm64-build, because a workflow file is
      # frozen for the whole run: a mid-run (BUILD-REPAIR) agent can rewrite the
      # composite action and scripts/, but it cannot touch these lines for this
      # run. The composite action runs the gate too, for fast feedback; THIS is
      # the step that decides, and it is deliberately not skippable — no `if:`,
      # no `continue-on-error`, and the run block below must stay a bare
      # invocation (no `|| true`, no `echo`) or it stops enforcing anything.
      #
      # The gate must both EXIT 0 and leave a stamp proving which tree it
      # validated and how many assertions actually executed. The stale stamp is
      # deleted first so a stamp forged by a repair-added step earlier in the
      # job cannot satisfy this check.
      - name: Enforce cloud severance (frozen — cannot be repaired away)
        shell: bash
        env:
          BUILT_SHA: ${{ steps.sha.outputs.sha }}
          # (CI-INTEGRITY) Step-level `env:` has the HIGHEST precedence in the
          # runner's env layering — it is applied after anything an earlier step
          # wrote to $GITHUB_ENV. Pinning these to empty here is the only real
          # PREVENTION available, because bash sources $BASH_ENV before the
          # first line of the run block below: a repairable step that put
          # BASH_ENV=<path> into $GITHUB_ENV would otherwise get its own code
          # executed inside this frozen step's shell, where a bare `exit 0`
          # ends the gate before it starts. NODE_OPTIONS is already in the
          # runner's own _setEnvBlockList; BASH_ENV, ENV and NODE_PATH are not,
          # which is why the one variable that was handled was the one that
          # could not have been set anyway.
          BASH_ENV: ''
          ENV: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          set -euo pipefail
          # Belt and braces behind the step-level pinning above. Reaching this
          # line with BASH_ENV/ENV non-empty would mean the precedence
          # assumption failed AND foreign code already ran in this shell, so it
          # is reported as tampering rather than quietly cleaned up. (An
          # attacker whose sourced file exits 0 is never seen here at all —
          # prevention is the env block, this is detection.)
          if [ -n "${BASH_ENV:-}" ] || [ -n "${ENV:-}" ]; then
            echo "::error::(CLOUD-SEVERANCE-P1) BASH_ENV/ENV is set on entry to the frozen enforcement step (BASH_ENV='${BASH_ENV:-}' ENV='${ENV:-}'). Bash sources that file before this step's first line, so an earlier repairable step tried to run code inside the gate's own shell. Treating this as tampering. Refusing to publish."
            exit 1
          fi
          # Everything before this step in the job runs from the REPAIRABLE
          # composite action, and a step can persist state to $GITHUB_PATH and
          # $GITHUB_ENV that later steps inherit. So this frozen step must not
          # inherit an interpreter or its options from that state: NODE_OPTIONS
          # can inject --require, NODE_PATH can redirect module resolution, and
          # a poisoned PATH can shadow `node` itself.
          unset BASH_ENV ENV NODE_OPTIONS NODE_PATH
          # Fixed absolute PATH. $GITHUB_PATH prepends whatever an earlier
          # repairable step asked for, and that would otherwise decide what
          # `rm` means here and what `git` and `7z` mean inside the gate (it
          # shells out to git for the sha it stamps, and to 7-Zip to extract
          # the published installer). No fallback to the inherited PATH:
          # a missing tool fails loud instead.
          export PATH="/c/Program Files/Git/usr/bin:/c/Program Files/Git/mingw64/bin:/c/Program Files/Git/bin:/c/Program Files/Git/cmd:/c/Program Files/7-Zip:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem"
          for tool in git rm; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::(CLOUD-SEVERANCE-P1) '$tool' does not resolve on the pinned PATH ($PATH) — refusing to fall back to the inherited PATH, which an earlier repairable step can poison. Fix the pinned PATH in this frozen step."
              exit 1
            }
          done
          NODE_BIN=""
          for candidate in \
            "/c/Program Files/nodejs/node.exe" \
            "$RUNNER_TOOL_CACHE"/node/*/arm64/node.exe \
            "$RUNNER_TOOL_CACHE"/node/*/x64/node.exe
          do
            if [ -x "$candidate" ]; then NODE_BIN="$candidate"; break; fi
          done
          if [ -z "$NODE_BIN" ]; then
            echo "::error::(CLOUD-SEVERANCE-P1) no node found at a trusted absolute path — refusing to resolve node from PATH, which an earlier repairable step can poison."
            exit 1
          fi
          echo "using node: $NODE_BIN ($("$NODE_BIN" --version))"
          rm -f .fork/cloud-severance-stamp.json
          "$NODE_BIN" scripts/check-cloud-severance.mjs
          # The verifier below is passed to node as a SINGLE-quoted shell
          # argument, and it therefore uses double quotes internally and
          # contains no apostrophe anywhere — not even in a comment.
          #
          # This is not style. It was written as a DOUBLE-quoted argument with
          # single-quoted JS inside, and one explanatory comment contained the
          # phrase "exactly the expected assertion set ran" — whose quotes
          # closed the shell string. Bash then word-split the remainder into
          # argv, node executed only the fragment before it, and exited 0. The
          # sha and mode checks happened to sit before that point and survived;
          # the assertion-count check sat after it and NEVER RAN. A gate whose
          # verifier can be silently truncated by punctuation is not a gate.
          #
          # So: keep the prose out here in shell comments where quoting cannot
          # bite, keep the JS quote-free, and — because neither rule is
          # self-enforcing — make the verifier PROVE it reached its own last
          # line. The marker check below is what makes a future recurrence
          # loud instead of silent.
          #
          # EXPECTED = 38 = 21 source/dist assertions + 8 over the PACKAGED
          # app.asar + 8 over the asar EXTRACTED FROM THE PUBLISHED INSTALLER
          # + 1 app-update.yml check inside that installer. The source/dist
          # figure grew from 11 to 21 with (CLOUD-SEVERANCE-P2): 7 cloud-origin
          # absence checks, better-auth's HTTP routes, the POSITIVE
          # egress-fence FENCE-BLOCK marker check, and the CSP websocket-scope
          # check. The installer set is
          # the load-bearing one: the .exe is the only file
          # publish-arm64-release.sh uploads, and a repair could scrub the
          # unpacked asar AFTER the .exe was built from it.
          #
          # LOCKSTEP: that constant is duplicated in all THREE enforcement steps
          # in this file (build-attempt-1/2/3). Growing the gate means updating
          # every copy in the same commit; a partial update makes the attempts
          # disagree and the ones left behind refuse to publish. Deliberate --
          # the count is the only thing proving the gate that ran is the gate
          # this file vouches for. Equality, not a floor: fewer means the gate
          # was weakened, more means it grew without this frozen check being
          # updated, and an unreviewed assertion set is not the one this check
          # vouches for.
          VERIFY_OUT=$("$NODE_BIN" -e '
            const fs = require("fs");
            const p = ".fork/cloud-severance-stamp.json";
            if (!fs.existsSync(p)) {
              console.error("::error::(CLOUD-SEVERANCE-P1) gate exited 0 but wrote no stamp — it did not really run. Refusing to publish.");
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const want = process.env.BUILT_SHA;
            if (s.sha !== want) {
              console.error("::error::(CLOUD-SEVERANCE-P1) stamp validated sha " + s.sha + " but this job built " + want + ". Refusing to publish.");
              process.exit(1);
            }
            if (s.mode !== "full") {
              console.error("::error::(CLOUD-SEVERANCE-P1) stamp mode is " + s.mode + ", not full — the artifact assertions were skipped. Refusing to publish.");
              process.exit(1);
            }
            const EXPECTED = 38;
            if (s.assertionsPassed !== EXPECTED) {
              console.error("::error::(CLOUD-SEVERANCE-P2) stamp reports " + s.assertionsPassed + " assertions, expected exactly " + EXPECTED + " — either the gate was weakened, or it grew and the EXPECTED constant was not updated in ALL THREE enforcement steps of this workflow in lockstep. Refusing to publish.");
              process.exit(1);
            }
            console.log("(CLOUD-SEVERANCE-P1) stamp verified: sha=" + s.sha + " assertions=" + s.assertionsPassed + " mode=" + s.mode);
            console.log("STAMP-VERIFIER-REACHED-END");
          ')
          printf '%s\n' "$VERIFY_OUT"
          case "$VERIFY_OUT" in
            *STAMP-VERIFIER-REACHED-END*) ;;
            *)
              echo "::error::(CLOUD-SEVERANCE-P1) the stamp verifier exited 0 without printing its end-of-script marker, so it did not run to completion — most likely its script was truncated by a quoting change and node executed only a fragment. Every check after the truncation point silently did not happen. Refusing to publish."
              exit 1
              ;;
          esac
      # Publishing moved OUT of the composite action so that it sits AFTER the
      # frozen enforcement step above. It used to be the action's last step,
      # which meant a repair that neutered the action's own severance check
      # would have published the Release before anything frozen could object.
      # Now a failed enforcement simply means this step never runs.
      - name: Publish GitHub Release
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-arm64-release.sh
      - name: Mark attempt green
        id: done
        shell: bash
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  repair-2:
    needs: [repair-1, build-attempt-2]
    if: ${{ !cancelled() && needs.repair-1.outputs.repaired == 'true' && needs.build-attempt-2.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      repaired: ${{ steps.repair.outputs.repaired }}
      sha: ${{ steps.repair.outputs.sha }}
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.repair_branch || github.ref_name }}
          fetch-depth: 50
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # (CI-INTEGRITY) Recorded BEFORE the AI step, as a step OUTPUT rather than
      # a file: the runner owns step outputs, so an agent with shell access
      # cannot rewrite this the way it could a path under the workspace or
      # $RUNNER_TEMP. It anchors both the trusted validator extracted below and
      # every base-vs-head comparison that validator makes.
      - name: Record pre-repair sha (frozen)
        id: prerepair
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Collect failure evidence
        shell: bash
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build-attempt-2.outputs.sha }}
          REPAIR_BRANCH: ${{ inputs.repair_branch || github.ref_name }}
        run: bash scripts/ci-repair.sh collect
      - name: AI repair round 2 (credential-less)
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROUND: '2'
          REPAIR_BRANCH: ${{ inputs.repair_branch || github.ref_name }}
        run: bash scripts/ci-repair.sh agent
      - name: Validate + push repair
        id: repair
        shell: bash
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ROUND: '2'
          REPAIR_BRANCH: ${{ inputs.repair_branch || github.ref_name }}
          PUSH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' && secrets.WORKFLOW_PUSH_TOKEN || github.token }}
          HAS_WORKFLOW_PAT: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' }}
          TRUSTED_BASE_SHA: ${{ steps.prerepair.outputs.sha }}
          # (CI-INTEGRITY) This step holds PUSH_TOKEN and runs immediately after
          # the agent step, which has unrestricted shell access. Pinning the
          # interpreter env at step level (highest precedence, applied after
          # $GITHUB_ENV) is what stops the agent from having its own code
          # sourced into this shell via BASH_ENV before the first line below —
          # a shell that could push arbitrary content, write repaired=true to
          # $GITHUB_OUTPUT, exit 0, and exfiltrate the PAT. Pinning the
          # validator's BYTES (below) is worthless if the environment those
          # bytes execute in is attacker-controlled.
          BASH_ENV: ''
          ENV: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
        # (CI-INTEGRITY) Run the PRE-AGENT copy of the validator, not the one in
        # the working tree the agent just edited. ci-repair.sh is a frozen path,
        # but the check that enforces that freeze lives INSIDE ci-repair.sh — so
        # an agent that rewrote it would have been judged by its own rewrite.
        # Extracting the blob at the recorded pre-repair sha makes the executing
        # bytes trusted; the freeze check then still fails the repair for having
        # touched the file. ai-run.sh comes too because ci-repair.sh sources it
        # relative to its own location.
        run: |
          set -euo pipefail
          # Detection behind the step-level env pinning above; see B2 note there
          # for why prevention has to happen before this shell starts.
          if [ -n "${BASH_ENV:-}" ] || [ -n "${ENV:-}" ]; then
            echo "::error::(CI-INTEGRITY) BASH_ENV/ENV is set on entry to the validate+push step (BASH_ENV='${BASH_ENV:-}' ENV='${ENV:-}') — bash sources that file before this step's first line, so the credential-less agent step tried to run code inside the shell that holds PUSH_TOKEN. Treating this as tampering. Refusing to push."
            exit 1
          fi
          unset BASH_ENV ENV NODE_OPTIONS NODE_PATH
          # Fixed absolute PATH. The agent can write $GITHUB_PATH, and every
          # tool this step and the trusted validator depend on — git, node,
          # python3, base64, diff, grep — would otherwise be attacker-resolved
          # inside a shell holding the workflow-scoped PAT. No fallback: a tool
          # missing from the pinned PATH fails loud (closed) rather than
          # silently resolving through the inherited one. This shadows
          # setup-node's tool-cache node; the system node is sufficient here and
          # $RUNNER_TOOL_CACHE is agent-writable, so it is deliberately not used.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          for tool in bash git node python3 base64 diff grep sed; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::(CI-INTEGRITY) '$tool' does not resolve on the pinned PATH ($PATH) — refusing to fall back to the inherited PATH, which the agent step can poison. Add its directory to the pinned PATH in this frozen step."
              exit 1
            }
          done
          TRUSTED_DIR="$RUNNER_TEMP/ci-repair-trusted-$ROUND"
          rm -rf "$TRUSTED_DIR" && mkdir -p "$TRUSTED_DIR"
          /usr/bin/git show "$TRUSTED_BASE_SHA:scripts/ci-repair.sh" > "$TRUSTED_DIR/ci-repair.sh"
          /usr/bin/git show "$TRUSTED_BASE_SHA:scripts/ai-run.sh"    > "$TRUSTED_DIR/ai-run.sh"
          /bin/bash "$TRUSTED_DIR/ci-repair.sh" push

  build-attempt-3:
    needs: [repair-2]
    if: ${{ !cancelled() && needs.repair-2.outputs.repaired == 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 180
    # Final attempt: no continue-on-error; its failure is real and terminal.
    outputs:
      ok: ${{ steps.done.outputs.ok }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Configure git long paths (Windows MAX_PATH)
        shell: bash
        run: git config --system core.longpaths true || git config --global core.longpaths true
      - name: Checkout repaired source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.repair-2.outputs.sha }}
          fetch-depth: 1
      - name: Record built sha
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build, package, verify
        uses: ./.github/actions/arm64-build
        with:
          gh-token: ${{ github.token }}
      # (CLOUD-SEVERANCE-P1) THE severance enforcement point. It lives in the
      # WORKFLOW, not in .github/actions/arm64-build, because a workflow file is
      # frozen for the whole run: a mid-run (BUILD-REPAIR) agent can rewrite the
      # composite action and scripts/, but it cannot touch these lines for this
      # run. The composite action runs the gate too, for fast feedback; THIS is
      # the step that decides, and it is deliberately not skippable — no `if:`,
      # no `continue-on-error`, and the run block below must stay a bare
      # invocation (no `|| true`, no `echo`) or it stops enforcing anything.
      #
      # The gate must both EXIT 0 and leave a stamp proving which tree it
      # validated and how many assertions actually executed. The stale stamp is
      # deleted first so a stamp forged by a repair-added step earlier in the
      # job cannot satisfy this check.
      - name: Enforce cloud severance (frozen — cannot be repaired away)
        shell: bash
        env:
          BUILT_SHA: ${{ steps.sha.outputs.sha }}
          # (CI-INTEGRITY) Step-level `env:` has the HIGHEST precedence in the
          # runner's env layering — it is applied after anything an earlier step
          # wrote to $GITHUB_ENV. Pinning these to empty here is the only real
          # PREVENTION available, because bash sources $BASH_ENV before the
          # first line of the run block below: a repairable step that put
          # BASH_ENV=<path> into $GITHUB_ENV would otherwise get its own code
          # executed inside this frozen step's shell, where a bare `exit 0`
          # ends the gate before it starts. NODE_OPTIONS is already in the
          # runner's own _setEnvBlockList; BASH_ENV, ENV and NODE_PATH are not,
          # which is why the one variable that was handled was the one that
          # could not have been set anyway.
          BASH_ENV: ''
          ENV: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          set -euo pipefail
          # Belt and braces behind the step-level pinning above. Reaching this
          # line with BASH_ENV/ENV non-empty would mean the precedence
          # assumption failed AND foreign code already ran in this shell, so it
          # is reported as tampering rather than quietly cleaned up. (An
          # attacker whose sourced file exits 0 is never seen here at all —
          # prevention is the env block, this is detection.)
          if [ -n "${BASH_ENV:-}" ] || [ -n "${ENV:-}" ]; then
            echo "::error::(CLOUD-SEVERANCE-P1) BASH_ENV/ENV is set on entry to the frozen enforcement step (BASH_ENV='${BASH_ENV:-}' ENV='${ENV:-}'). Bash sources that file before this step's first line, so an earlier repairable step tried to run code inside the gate's own shell. Treating this as tampering. Refusing to publish."
            exit 1
          fi
          # Everything before this step in the job runs from the REPAIRABLE
          # composite action, and a step can persist state to $GITHUB_PATH and
          # $GITHUB_ENV that later steps inherit. So this frozen step must not
          # inherit an interpreter or its options from that state: NODE_OPTIONS
          # can inject --require, NODE_PATH can redirect module resolution, and
          # a poisoned PATH can shadow `node` itself.
          unset BASH_ENV ENV NODE_OPTIONS NODE_PATH
          # Fixed absolute PATH. $GITHUB_PATH prepends whatever an earlier
          # repairable step asked for, and that would otherwise decide what
          # `rm` means here and what `git` and `7z` mean inside the gate (it
          # shells out to git for the sha it stamps, and to 7-Zip to extract
          # the published installer). No fallback to the inherited PATH:
          # a missing tool fails loud instead.
          export PATH="/c/Program Files/Git/usr/bin:/c/Program Files/Git/mingw64/bin:/c/Program Files/Git/bin:/c/Program Files/Git/cmd:/c/Program Files/7-Zip:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem"
          for tool in git rm; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::(CLOUD-SEVERANCE-P1) '$tool' does not resolve on the pinned PATH ($PATH) — refusing to fall back to the inherited PATH, which an earlier repairable step can poison. Fix the pinned PATH in this frozen step."
              exit 1
            }
          done
          NODE_BIN=""
          for candidate in \
            "/c/Program Files/nodejs/node.exe" \
            "$RUNNER_TOOL_CACHE"/node/*/arm64/node.exe \
            "$RUNNER_TOOL_CACHE"/node/*/x64/node.exe
          do
            if [ -x "$candidate" ]; then NODE_BIN="$candidate"; break; fi
          done
          if [ -z "$NODE_BIN" ]; then
            echo "::error::(CLOUD-SEVERANCE-P1) no node found at a trusted absolute path — refusing to resolve node from PATH, which an earlier repairable step can poison."
            exit 1
          fi
          echo "using node: $NODE_BIN ($("$NODE_BIN" --version))"
          rm -f .fork/cloud-severance-stamp.json
          "$NODE_BIN" scripts/check-cloud-severance.mjs
          # The verifier below is passed to node as a SINGLE-quoted shell
          # argument, and it therefore uses double quotes internally and
          # contains no apostrophe anywhere — not even in a comment.
          #
          # This is not style. It was written as a DOUBLE-quoted argument with
          # single-quoted JS inside, and one explanatory comment contained the
          # phrase "exactly the expected assertion set ran" — whose quotes
          # closed the shell string. Bash then word-split the remainder into
          # argv, node executed only the fragment before it, and exited 0. The
          # sha and mode checks happened to sit before that point and survived;
          # the assertion-count check sat after it and NEVER RAN. A gate whose
          # verifier can be silently truncated by punctuation is not a gate.
          #
          # So: keep the prose out here in shell comments where quoting cannot
          # bite, keep the JS quote-free, and — because neither rule is
          # self-enforcing — make the verifier PROVE it reached its own last
          # line. The marker check below is what makes a future recurrence
          # loud instead of silent.
          #
          # EXPECTED = 38 = 21 source/dist assertions + 8 over the PACKAGED
          # app.asar + 8 over the asar EXTRACTED FROM THE PUBLISHED INSTALLER
          # + 1 app-update.yml check inside that installer. The source/dist
          # figure grew from 11 to 21 with (CLOUD-SEVERANCE-P2): 7 cloud-origin
          # absence checks, better-auth's HTTP routes, the POSITIVE
          # egress-fence FENCE-BLOCK marker check, and the CSP websocket-scope
          # check. The installer set is
          # the load-bearing one: the .exe is the only file
          # publish-arm64-release.sh uploads, and a repair could scrub the
          # unpacked asar AFTER the .exe was built from it.
          #
          # LOCKSTEP: that constant is duplicated in all THREE enforcement steps
          # in this file (build-attempt-1/2/3). Growing the gate means updating
          # every copy in the same commit; a partial update makes the attempts
          # disagree and the ones left behind refuse to publish. Deliberate --
          # the count is the only thing proving the gate that ran is the gate
          # this file vouches for. Equality, not a floor: fewer means the gate
          # was weakened, more means it grew without this frozen check being
          # updated, and an unreviewed assertion set is not the one this check
          # vouches for.
          VERIFY_OUT=$("$NODE_BIN" -e '
            const fs = require("fs");
            const p = ".fork/cloud-severance-stamp.json";
            if (!fs.existsSync(p)) {
              console.error("::error::(CLOUD-SEVERANCE-P1) gate exited 0 but wrote no stamp — it did not really run. Refusing to publish.");
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const want = process.env.BUILT_SHA;
            if (s.sha !== want) {
              console.error("::error::(CLOUD-SEVERANCE-P1) stamp validated sha " + s.sha + " but this job built " + want + ". Refusing to publish.");
              process.exit(1);
            }
            if (s.mode !== "full") {
              console.error("::error::(CLOUD-SEVERANCE-P1) stamp mode is " + s.mode + ", not full — the artifact assertions were skipped. Refusing to publish.");
              process.exit(1);
            }
            const EXPECTED = 38;
            if (s.assertionsPassed !== EXPECTED) {
              console.error("::error::(CLOUD-SEVERANCE-P2) stamp reports " + s.assertionsPassed + " assertions, expected exactly " + EXPECTED + " — either the gate was weakened, or it grew and the EXPECTED constant was not updated in ALL THREE enforcement steps of this workflow in lockstep. Refusing to publish.");
              process.exit(1);
            }
            console.log("(CLOUD-SEVERANCE-P1) stamp verified: sha=" + s.sha + " assertions=" + s.assertionsPassed + " mode=" + s.mode);
            console.log("STAMP-VERIFIER-REACHED-END");
          ')
          printf '%s\n' "$VERIFY_OUT"
          case "$VERIFY_OUT" in
            *STAMP-VERIFIER-REACHED-END*) ;;
            *)
              echo "::error::(CLOUD-SEVERANCE-P1) the stamp verifier exited 0 without printing its end-of-script marker, so it did not run to completion — most likely its script was truncated by a quoting change and node executed only a fragment. Every check after the truncation point silently did not happen. Refusing to publish."
              exit 1
              ;;
          esac
      # Publishing moved OUT of the composite action so that it sits AFTER the
      # frozen enforcement step above. It used to be the action's last step,
      # which meant a repair that neutered the action's own severance check
      # would have published the Release before anything frozen could object.
      # Now a failed enforcement simply means this step never runs.
      - name: Publish GitHub Release
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-arm64-release.sh
      - name: Mark attempt green
        id: done
        shell: bash
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  verdict:
    needs: [build-attempt-1, repair-1, build-attempt-2, repair-2, build-attempt-3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      built_sha: ${{ steps.decide.outputs.built_sha }}
    steps:
      - name: Decide build outcome
        id: decide
        shell: bash
        env:
          OK1: ${{ needs.build-attempt-1.outputs.ok }}
          OK2: ${{ needs.build-attempt-2.outputs.ok }}
          OK3: ${{ needs.build-attempt-3.outputs.ok }}
          SHA1: ${{ needs.build-attempt-1.outputs.sha }}
          SHA2: ${{ needs.build-attempt-2.outputs.sha }}
          SHA3: ${{ needs.build-attempt-3.outputs.sha }}
          R1: ${{ needs.repair-1.result }}
          R2: ${{ needs.repair-2.result }}
        run: |
          set -euo pipefail
          if [ "$OK1" = "true" ]; then
            echo "built_sha=$SHA1" >> "$GITHUB_OUTPUT"; echo "Build green on attempt 1 ($SHA1)."; exit 0
          fi
          if [ "$OK2" = "true" ]; then
            echo "built_sha=$SHA2" >> "$GITHUB_OUTPUT"; echo "Build green on attempt 2 after 1 AI repair ($SHA2)."; exit 0
          fi
          if [ "$OK3" = "true" ]; then
            echo "built_sha=$SHA3" >> "$GITHUB_OUTPUT"; echo "Build green on attempt 3 after 2 AI repairs ($SHA3)."; exit 0
          fi
          echo "::error::(BUILD-REPAIR) build failed after all attempts (repair-1: $R1, repair-2: $R2). See the failed build/repair jobs above."
          exit 1
