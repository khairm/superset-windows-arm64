<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme boot script must run before body to prevent flash -->
    <script type="module" src="/theme-boot.js"></script>
    <!--
      Content Security Policy
      https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP

      (CLOUD-SEVERANCE-P1) The PostHog and Sentry origins, and Sentry's IPC
      scheme, are GONE from both script-src and connect-src — this fork bakes no
      telemetry key or DSN, so nothing may reach those hosts. (Their hostnames
      are deliberately not spelled out here: check-cloud-severance.mjs scans this
      whole file, comments included, so the only mention of them is their
      absence.) ws:/wss:/http://127.0.0.1:* (terminals + host-service),
      blob:/data: (file previews) and the relay/api/electric entries are
      deliberately UNTOUCHED: removing the loopback/ws entries kills every
      terminal, and sign-in/Electric are severed in a later phase.

      - default-src 'self': Only allow resources from same origin
      - script-src 'self' 'wasm-unsafe-eval': Allow scripts from same origin + WebAssembly (for xterm ImageAddon)
      - style-src 'self' 'unsafe-inline': Allow styles from same origin + inline (needed for CSS-in-JS)
      - connect-src 'self' data: blob: ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:*
        http://127.0.0.1:* http://localhost:*: (CLOUD-SEVERANCE-P2) LOOPBACK ONLY.
        Terminals and the host-service live on 127.0.0.1; data:/blob: carry file
        attachments and previews. The cloud API, the Electric proxy, the relay and
        its two failover targets are gone — and so is the bare `ws: wss:` pair that
        used to sit here, which allowed a WebSocket to ANY host on the internet and
        would have made removing the named relay entries purely cosmetic. Upstream's
        cloud-sandbox preview origin is not here either: a sandbox is reached
        through the cloud this fork does not talk to. Its hostname is spelled
        out in the gate rather than here, because a comment naming an origin
        ships in the bundle and would satisfy the very check that hunts for it.
        Upstream's remote blob-storage entry for published page content is not
        here either, for the same reason: the page pane renders what main serves
        it under superset-page:, and fetching a page body from someone else's
        host is exactly the egress this phase removes.
      - img-src 'self' data: blob: https: http:: Allow images from any source (needed for favicons, browser pane webview content, and file attachment previews)
      - media-src 'self' data: blob:: Allow <video>/<audio> from blob + data URIs (file preview); without this, media falls back to default-src 'self' and blob video won't play
      - font-src 'self': Allow fonts from same origin
      - frame-src https: http: data: blob:: Allow webview browser pane to load any URL + the page pane's frame, served by the usercontent origin under the page's own CSP
      - child-src 'self' blob:: Allow workers from same origin + blob workers
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob: ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:* http://127.0.0.1:* http://localhost:*; img-src 'self' data: blob: https: http:; media-src 'self' data: blob:; font-src 'self'; frame-src https: http: data: blob: superset-page:; child-src 'self' blob:;" />
  </head>

  <body>
    <app></app>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
