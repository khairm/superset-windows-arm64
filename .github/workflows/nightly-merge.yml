name: Nightly upstream merge

# The ongoing half of the architecture. Nightly: if upstream superset published a
# newer desktop-v* tag than .fork/upstream-baseline.txt, merge that tag into the
# fork. git's 3-way merge handles the non-conflicting majority deterministically;
# Opus 5 (--model claude-opus-5, --effort high) resolves ONLY the conflicted files, then (MERGE-ADAPT)
# proactively ports fork-owned call sites across cleanly-merging upstream API
# refactors. This closes the v1.16.0 failure class: upstream deleted/privatized
# collections and workspace exports while fork-only callers merged with zero
# conflicts. Then the marker/dependency/ReferenceError gates run, followed by a
# bounded, fail-closed (MERGE-SEMANTIC-GATE) review -> adapt -> fresh-review loop
# over the WHOLE merged delta. Only then does the deterministic ARM64 build run.
# On a clean merge + green build the build publishes a full Release and we
# fast-forward the baseline. Any failure (unresolvable conflict, unported or
# unrepaired breakage, lost marker, build failure) hard-aborts and leaves the
# baseline untouched -> recovery loop.
#
# EXCEPTION: a run blocked ONLY because the Claude CLI never reached the model
# (usage cap, dead credential, transport) merged, built and published NOTHING,
# so it concludes GREEN as an (AI-UNAVAILABLE) no-op — loud ::notice:: + step
# summary, baseline untouched, build/advance skipped — and GitHub therefore does
# not email a quota week. The abort must be PROVEN by the AI wrapper, not just
# by exit code 99, and the streak clears only on a night the CLI provably
# reached the model. AI_UNAVAILABLE_STREAK_THRESHOLD consecutive blocked
# NIGHTS (same-day re-runs count once) is no longer routine and fails RED.
# See scripts/ai-streak.sh.
#
# AI cost scales with the UPSTREAM delta per release, NOT with how large the fork
# grows. The build is deterministic but SELF-REPAIRING: a failed attempt goes to
# a bounded (BUILD-REPAIR) Opus 5 loop (max 2 repairs / 3 attempts) that pushes
# fixes to the candidate branch; every deterministic gate re-runs on the
# repaired tree. See build-arm64.yml.

on:
  schedule:
    - cron: '13 2 * * *' # ~02:13 UTC daily (off-hour minute: on-the-hour crons queue for hours on GitHub's shared scheduler)
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Merge a specific upstream desktop-v* tag (blank = latest)'
        required: false
        default: ''
      rehearse:
        description: 'Dry-run: full merge + resolver + every gate, but NO candidate push, NO build, NO advance (emulates the overnight run safely)'
        required: false
        default: ''
      rehearse_base:
        description: 'Rehearse from this historical main SHA (requires rehearse=true + force_tag; replays a past nightly exactly)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read # build-arm64.yml repair jobs download their run's failed-job logs

# (NIGHTLY-INTEGRITY) Never let two nightly instances interleave: an overlapping
# schedule + manual dispatch can delete/replace the mutable candidate branch
# between one run's merge, build checkout and advance. Queue, never cancel — a
# running merge/build must finish or fail on its own.
concurrency:
  group: nightly-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.do.outputs.should_build }}
      newtag: ${{ steps.do.outputs.newtag }}
      version: ${{ steps.do.outputs.version }}
      candidate: ${{ steps.do.outputs.candidate }}
      sha: ${{ steps.do.outputs.sha }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DISABLE_NON_ESSENTIAL_MODEL_CALLS: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      # Conflict resolution can touch large files; give Opus headroom.
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '128000'
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # (NIGHTLY-INTEGRITY) Always merge from CURRENT main, not the event
          # SHA: a queued run (concurrency holds one pending) otherwise checks
          # out the commit main pointed at when it was TRIGGERED — pre-advance
          # — re-merges an already-merged tag into a stale tree, replaces the
          # freshly published release with a sibling merge, and its final
          # main push dies non-fast-forward AFTER publishing.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # (LOCK-REGEN) Lock regeneration below needs bun; pin the EXACT version
      # the build uses so the lock we commit is byte-identical to what the
      # frozen build install consumes.
      - name: Setup Bun (match the build's pinned version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Merge upstream + resolve + gate
        id: do
        shell: bash
        # Dispatch inputs come in as ENV, never inline ${{ }} in the script:
        # (a) GitHub caps any expression-bearing scalar at 21000 chars — an
        # inline expression in this large script made the whole workflow
        # unparseable (the 2026-07-17 push-validation failure: schedule would
        # silently not fire); (b) env is the non-injectable way to consume
        # user input in shell.
        env:
          FORCE_TAG: ${{ github.event.inputs.force_tag }}
          REHEARSE: ${{ github.event.inputs.rehearse }}
          REHEARSE_BASE: ${{ github.event.inputs.rehearse_base }}
        run: |
          set -euo pipefail
          git config user.name "superset-arm64-bot"
          git config user.email "actions@users.noreply.github.com"

          # --- validate dispatch inputs at the boundary ------------------------
          # FIRST, before the AI wrapper and before the (AI-UNAVAILABLE) trap is
          # armed: a garbage dispatch input is a caller error that must fail
          # loud every time. If this ran after ensure_claude, a quota outage
          # during the install would convert the whole run — including the
          # unreported bad input — into a green no-op, and the operator would
          # never learn their dispatch was malformed.
          FORCE="${FORCE_TAG:-}"
          REHEARSE="${REHEARSE:-}"
          REHEARSE_BASE="${REHEARSE_BASE:-}"
          if [ -n "$REHEARSE" ] && [ "$REHEARSE" != "true" ] && [ "$REHEARSE" != "false" ]; then
            echo "::error::rehearse must be '', 'true' or 'false' (got '$REHEARSE')"; exit 1
          fi
          if [ -n "$REHEARSE_BASE" ]; then
            if [ "$REHEARSE" != "true" ] || [ -z "$FORCE" ]; then
              echo "::error::rehearse_base requires rehearse=true AND force_tag (replaying a past nightly needs both the base and the tag)"; exit 1
            fi
            if ! REHEARSE_SHA=$(git rev-parse -q --verify "$REHEARSE_BASE^{commit}"); then
              echo "::error::rehearse_base '$REHEARSE_BASE' is not a commit in this repo"; exit 1
            fi
            echo "REHEARSAL: replaying from historical base $REHEARSE_SHA"
            git checkout -q "$REHEARSE_SHA"
          fi

          # --- shared Claude CLI wrapper (scripts/ai-run.sh) -------------------
          # Sourced ONCE, before the merge: the classifier that decides tonight's
          # aborts is our pre-merge one, so an upstream edit to it cannot change
          # them. `claude … || true` used to discard both exit code and output,
          # so a quota-exhausted account burned every retry in seconds and the
          # run blamed the merge (2026-08-13/14 nightlies). See the script header.
          source scripts/ai-run.sh # (AI-UNAVAILABLE)
          # (AI-UNAVAILABLE) This EXIT trap turns a PROVEN CLI outage — and only
          # that — into a green no-op, and escalates a run of blocked nights to
          # RED. Rationale, storage and the threshold live in the script header.
          # Armed BEFORE ensure_claude: installing the CLI is itself an AI pass.
          # Override the threshold with AI_UNAVAILABLE_STREAK_THRESHOLD.
          source scripts/ai-streak.sh # (AI-UNAVAILABLE)
          AI_STREAK_DRY_RUN="$REHEARSE" # validated above; the script owns the name
          ai_streak_install_trap
          # One guarded install covers every AI pass below: they all run in THIS
          # step's single shell (the REFERR loop used to reinstall per attempt).
          ensure_claude

          # --- detect the upstream tag to merge --------------------------------
          git remote add upstream https://github.com/superset-sh/superset.git 2>/dev/null || true
          # Fetch upstream's desktop-v* tags into an ISOLATED ref namespace.
          # Our OWN one-version release tags live in refs/tags/desktop-v<version>
          # (gh release create makes them at our build commit). A plain fetch into
          # refs/tags/ collides with every released version ("would clobber existing
          # tag" -> non-zero fetch -> set -e abort). The isolated namespace + --force
          # keeps upstream's source tags cleanly separate from our release tags.
          git fetch --no-recurse-submodules --force upstream \
            'refs/tags/desktop-v*:refs/upstream-tags/desktop-v*'
          # Validate the dispatch input at the boundary: it is used in ref
          # names — reject anything that is not a plain desktop-v<semver-ish>
          # tag.
          if [ -n "$FORCE" ] && ! [[ "$FORCE" =~ ^desktop-v[0-9][0-9.]*$ ]]; then
            echo "::error::force_tag '$FORCE' is not a desktop-v<version> tag"; exit 1
          fi
          if [ -n "$FORCE" ]; then
            NEWTAG="$FORCE"
          else
            LATEST=$(git for-each-ref --format='%(refname:lstrip=2)' 'refs/upstream-tags/desktop-v*' | sed -n 's/^desktop-v\([0-9][0-9.]*\)$/\1/p' | sort -V | tail -1)
            NEWTAG="desktop-v${LATEST}"
          fi
          BASE=$(tr -d '[:space:]' < .fork/upstream-baseline.txt)
          echo "baseline=$BASE  latest_upstream=$NEWTAG"
          if [ "$NEWTAG" = "$BASE" ]; then
            echo "Already at $BASE — nothing to merge."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/upstream-tags/$NEWTAG^{commit}" >/dev/null; then
            echo "::error::upstream tag $NEWTAG not found"; exit 1
          fi

          # --- candidate branch + merge ---------------------------------------
          CAND="nightly/${NEWTAG}"
          git switch -c "$CAND"
          # (I18N-UPSTREAM-BACKFILL) Pin the fork's pre-merge commit BEFORE the
          # merge touches anything. Its catalogs are the only place a fork-only
          # string's sixteen translations exist, and the backfill below reads
          # them from this exact sha.
          FORK_HEAD=$(git rev-parse --verify HEAD^{commit})
          echo "Merging $NEWTAG into the fork (no auto-commit)…"
          set +e
          git merge --no-commit --no-ff "refs/upstream-tags/$NEWTAG^{commit}"
          set -e

          # (NIGHTLY-INTEGRITY) `set +e` above accepts EVERY nonzero merge exit,
          # not just "conflicts". A fatal merge failure (lock error, corrupt
          # object, OOM) leaves NO MERGE_HEAD and possibly no conflicts either —
          # without this check it would read as a clean merge and we'd commit a
          # single-parent non-merge with a bumped baseline.
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::git merge of $NEWTAG failed fatally (no MERGE_HEAD) — aborting. Baseline untouched."
            exit 1
          fi

          # (WORKFLOW-FORK-OWNED) Surface — never silently discard — upstream's
          # workflow-tree delta before we drop it: upstream sometimes moves
          # build-relevant logic INTO CI (a codegen step, a required env var).
          # The delta goes to the job summary + log and is handed to the
          # semantic review below so build-relevant CI changes get flagged.
          WFDELTA_FILE="$RUNNER_TEMP/upstream-workflow-delta.diff"
          : > "$WFDELTA_FILE"
          if git rev-parse -q --verify "refs/upstream-tags/$BASE^{commit}" >/dev/null; then
            git diff "refs/upstream-tags/$BASE" "refs/upstream-tags/$NEWTAG" -- .github/workflows > "$WFDELTA_FILE" || true
          fi
          if [ -s "$WFDELTA_FILE" ]; then
            {
              echo "## Upstream workflow-tree delta ($BASE → $NEWTAG) — DROPPED, .github/workflows is fork-owned"
              echo '```'
              git diff --name-status "refs/upstream-tags/$BASE" "refs/upstream-tags/$NEWTAG" -- .github/workflows
              echo '```'
              echo "Full patch in the job log (group: dropped upstream workflow delta). Port anything build-relevant by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::dropped upstream workflow delta"
            cat "$WFDELTA_FILE"
            echo "::endgroup::"
          fi

          # (WORKFLOW-FORK-OWNED) .github/workflows is FORK-OWNED: the fork
          # carries ZERO upstream workflow files (upstream CI targets upstream's
          # infra/secrets and is meaningless here), and the Actions GITHUB_TOKEN
          # can NEVER push a .github/workflows/* change — GitHub rejects both
          # the candidate push and the main fast-forward with "refusing to allow
          # a GitHub App to create or update workflow … without `workflows`
          # permission" (desktop-v1.14.3 deploy-relay.yml incident: the merge,
          # gates and review all passed, then the push died). Restore our exact
          # workflow set BEFORE conflict detection: upstream-ADDED files are
          # dropped from index+worktree (--no-overlay), upstream edits to files
          # we long deleted resolve as ours, and the AI resolver never sees a
          # workflow path it could resurrect.
          #
          # UNMERGED paths must be cleared FIRST: `git checkout <tree> -- <dir>`
          # hard-errors ("path … is unmerged") on a modify/delete entry whose
          # file is absent in HEAD — upstream modifying a workflow we deleted
          # (desktop-v1.15.0 release-cli.yml incident: the nightly died right
          # here, before the resolver, two nights running). Resolve each
          # unmerged workflow path to OUR side: restore from HEAD when we carry
          # it, git rm when we deleted it.
          git diff --name-only --diff-filter=U -- .github/workflows | while IFS= read -r p; do
            if git cat-file -e "HEAD:$p" 2>/dev/null; then
              git checkout HEAD -- "$p"
            else
              git rm -q -f -- "$p"
            fi
          done
          git checkout --no-overlay HEAD -- .github/workflows

          # (NO-BUNDLED-SKILLS) plugins/superset is retired in this fork. Delete it
          # here — clean upstream adds AND unmerged stages — so the resolver below
          # never sees a path it could argue its way into keeping.
          git rm -r -f --ignore-unmatch -- plugins/superset

          # ONE statement of the FEATURES.md row rule, shared by the resolve and
          # the port prompt below, so hardening it never has to happen twice.
          FEATURES_ROW_RULE="the row TEXT is the specification and the marker token is only its label. Preserve the BEHAVIOUR the row describes and keep the fork's production call sites reachable — a marker token surviving inside dead or unreachable code is NOT feature preservation. Where rows interact, the rows themselves state which one wins (the '(REMOVE-STICKY)' and '(MASTER-ALWAYS-ACTIVE)' rows are the worked example); follow the row text, never a rule you infer from a field name."

          # (NO-BUNDLED-SKILLS) ONE statement of what "removed" means for the
          # retired skill system, shared by the resolve, port and adapt prompts.
          # The failure it forecloses is an agent reading a call into the removed
          # exports as a missing dependency and rebuilding it under a name the
          # gate's identifier list does not know — which passes every gate and
          # ships the thing the fork deleted.
          SKILLS_REMOVAL_RULE="The retired Superset-managed skills exports are retired, not relocated: never reimplement one under a new name, a new marker token, or a personal/user skill provisioner, and never re-add a path or identifier that scripts/check-no-bundled-skills.mjs forbids. Where merged code calls into that removed system, the correct fix is to delete the legacy sync import and its call site with NO replacement, leaving plugin metadata, user-owned and repo-local skill discovery, and unrelated CLI behaviour exactly as they are. Never satisfy it by banning skill tools a user asked for, and never delete the wider plugins CLI or plugins tree."

          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICTS" ]; then
            echo "::group::conflicts to resolve"; echo "$CONFLICTS"; echo "::endgroup::"
            PROMPT="IMPORTANT: Do NOT enter plan mode. You are inside a git repository mid-merge: upstream superset tag ${NEWTAG} is being merged into our Windows-ARM64 fork. ONLY the files listed by 'git diff --name-only --diff-filter=U' are conflicted. Resolve EVERY conflicted file: combine upstream's change with our fork's feature so BOTH intents survive and our feature keeps working; where upstream deliberately removed or refactored something we had only lightly touched, follow upstream. Do NOT edit any non-conflicted file. Do NOT weaken or remove any feature marker tracked in FEATURES.md. Before you decide a resolution, READ the FEATURES.md row for every feature the conflicted file participates in: ${FEATURES_ROW_RULE} Never change the version field of any package.json; never touch .github/workflows/**; never restore plugins/superset or any path or identifier that scripts/check-no-bundled-skills.mjs forbids. ${SKILLS_REMOVAL_RULE} After resolving each file run 'git add <file>'. Do NOT commit. Do NOT run any other git command. When every conflict is resolved and staged, stop. Output nothing."
            attempt=1
            while [ $attempt -le 3 ]; do
              echo "::group::claude resolve attempt $attempt"
              run_claude "resolve" "$PROMPT" || true
              echo "::endgroup::"
              if [ -z "$(git diff --name-only --diff-filter=U || true)" ]; then break; fi
              attempt=$((attempt+1))
            done
            REMAIN=$(git diff --name-only --diff-filter=U || true)
            if [ -n "$REMAIN" ]; then
              echo "::error::Opus could not resolve all conflicts for $NEWTAG — recovery: fix locally and re-baseline. Remaining:"; echo "$REMAIN"
              exit 1
            fi
          else
            echo "Clean merge — no conflicts."
          fi

          # (NO-BUNDLED-SKILLS) The plugin directory is gone; drop its marketplace
          # listing too — ONLY that entry, so an upstream marketplace that later
          # lists other plugins keeps them. Runs after resolution so the JSON is
          # marker-free, and refuses to guess at a shape it does not recognise.
          # Entry identity mirrors scripts/check-no-bundled-skills.mjs — change both.
          MARKETPLACE_PRUNED=$(node <<'NODE'
          const fs = require("node:fs");
          const FILE = ".claude-plugin/marketplace.json";
          if (!fs.existsSync(FILE)) process.exit(0);
          const raw = fs.readFileSync(FILE, "utf8");
          const data = JSON.parse(raw);
          if (!data || !Array.isArray(data.plugins)) {
            throw new Error(`${FILE}: expected a root object with a "plugins" array`);
          }
          if (data.plugins.some((e) => !e || typeof e !== "object" || Array.isArray(e))) {
            throw new Error(`${FILE}: expected every "plugins" entry to be an object`);
          }
          const kept = data.plugins.filter((e) => e.name !== "superset" && e.source !== "./plugins/superset");
          if (kept.length === data.plugins.length) process.exit(0);
          const indent = /\n([\t ]+)\S/.exec(raw)?.[1] ?? "\t";
          const eol = raw.includes("\r\n") ? "\r\n" : "\n";
          fs.writeFileSync(FILE, JSON.stringify({ ...data, plugins: kept }, null, indent).replace(/\n/g, eol) + eol);
          process.stdout.write("pruned");
          NODE
          )
          if [ -n "$MARKETPLACE_PRUNED" ]; then
            echo "(NO-BUNDLED-SKILLS) dropped the retired Superset entry from .claude-plugin/marketplace.json"
            git add -- .claude-plugin/marketplace.json
          fi

          # (MERGE-ADAPT) Snapshot the legitimate post-resolution manifest diff:
          # upstream carries AGENTS.md, while FEATURES.md is fork-owned. Any later
          # change means an AI pass edited its own acceptance or persisted prompt
          # criteria (CLAUDE.md includes AGENTS.md).
          MANIFEST_BASELINE=$(git diff HEAD -- FEATURES.md AGENTS.md | sha256sum)
          assert_manifest_untampered() {
            MANIFEST_CURRENT=$(git diff HEAD -- FEATURES.md AGENTS.md | sha256sum)
            if [ "$MANIFEST_CURRENT" != "$MANIFEST_BASELINE" ]; then
              echo "::error::AI editing changed FEATURES.md or AGENTS.md — refusing to trust a self-modified feature manifest. Baseline untouched."
              exit 1
            fi
          }

          # --- (MERGE-ADAPT) proactive port pass ------------------------------
          # Conflict-only resolution cannot see fork-only callers when upstream
          # cleanly refactors the APIs they consume. desktop-v1.16.0 demonstrated
          # the gap: upstream removed v2Projects and privatized/renamed workspace
          # registration exports, while every fork call site merged cleanly. Give
          # Opus the fork-delta file set plus both upstream trees so it can port
          # those call sites before the deterministic gates and semantic review.
          echo "::group::(MERGE-ADAPT) proactive port pass"
          # The deleted plugins/superset still differs from the upstream tag, so
          # exclude it: an allowlist entry is an invitation to recreate it.
          # ONE pathspec for every list below — the allowlist and the two
          # (MERGE-PORT-CONTEXT) evidence lists must protect the same paths, or
          # a path excluded from what the agent may edit could still be handed
          # to it as something to restore.
          FORK_PATHSPEC=(
            .
            ':(exclude).github/workflows/**'
            ':(exclude)plugins/superset/**'
            ':(exclude)bun.lock'
            ':(exclude)FEATURES.md'
            ':(exclude)AGENTS.md'
            ':(exclude).fork/**'
          )
          # --no-renames plus one collation, stated ONCE: the comm calls below
          # compare these lists, and comm needs both sides sorted the same way.
          sorted_names() { git diff --no-renames --name-only "$@" | LC_ALL=C sort -u; }
          FORK_DELTA_FILE="$RUNNER_TEMP/fork-delta-files.txt"
          git diff --name-only --cached "refs/upstream-tags/$NEWTAG" -- "${FORK_PATHSPEC[@]}" > "$FORK_DELTA_FILE"
          echo "Fork-owned / fork-modified files eligible for proactive porting:"
          cat "$FORK_DELTA_FILE"
          # (MERGE-PORT-CONTEXT) Two read-only evidence lists for the port agent.
          # A resolution that drops a fork-only file conflicts with nothing,
          # breaks no import the gates check, and is invisible in the allowlist
          # (a deleted path is not an editable one), so without the DELETED list
          # the port pass never sees it; the ADDED list is where upstream's
          # replacement for what it removed usually lives.
          DELETED_FORK_FILES_FILE="$RUNNER_TEMP/merge-deleted-fork-files.txt"
          ADDED_UPSTREAM_FILES_FILE="$RUNNER_TEMP/merge-added-upstream-files.txt"
          : > "$DELETED_FORK_FILES_FILE"
          sorted_names --cached --diff-filter=A HEAD -- "${FORK_PATHSPEC[@]}" > "$ADDED_UPSTREAM_FILES_FILE"
          if git rev-parse -q --verify "refs/upstream-tags/$BASE^{commit}" >/dev/null; then
            # Fork-owned = added or modified by the fork against the PREVIOUS
            # upstream baseline; deletions are excluded because a path the fork
            # had already deleted cannot be deleted again by this merge.
            sorted_names --diff-filter=AM "refs/upstream-tags/$BASE" HEAD -- "${FORK_PATHSPEC[@]}" > "$RUNNER_TEMP/fork-owned-at-head.txt"
            sorted_names --cached --diff-filter=D HEAD -- "${FORK_PATHSPEC[@]}" > "$RUNNER_TEMP/merge-deleted-paths.txt"
            LC_ALL=C comm -12 "$RUNNER_TEMP/fork-owned-at-head.txt" "$RUNNER_TEMP/merge-deleted-paths.txt" > "$DELETED_FORK_FILES_FILE"
            BASE_TREE_NOTE="Both upstream trees are available at refs/upstream-tags/${BASE} and refs/upstream-tags/${NEWTAG}."
          else
            # The baseline tag is not always fetchable (upstream can delete or
            # move a tag). Fork ownership is then unknowable, so claim nothing:
            # say so loudly, hand over an EMPTY list, and let the port pass and
            # every gate below run exactly as they otherwise would. The port
            # prompt is told the same thing rather than asserting a tree it
            # would then fail to read.
            echo "::notice::(MERGE-PORT-CONTEXT) refs/upstream-tags/$BASE is not available, so fork ownership cannot be established this run — the deleted-fork-file list is EMPTY and the port pass proceeds without it."
            BASE_TREE_NOTE="The upstream tree for ${NEWTAG} is available at refs/upstream-tags/${NEWTAG}, but refs/upstream-tags/${BASE} is NOT available this run, so you cannot diff the two upstream trees — work from the merged result and the fork's own history instead, and treat the deleted-fork-file list as empty for that reason alone, not as proof nothing was deleted."
          fi
          echo "Fork-owned files DELETED by this merge ($(wc -l < "$DELETED_FORK_FILES_FILE")):"
          cat "$DELETED_FORK_FILES_FILE"
          echo "Files ADDED by this merge ($(wc -l < "$ADDED_UPSTREAM_FILES_FILE")):"
          cat "$ADDED_UPSTREAM_FILES_FILE"
          # Defined HERE, ahead of the port pass, because both the port agent
          # and the adapt agent record UNRESOLVED BLOCKERS, and the semantic
          # review reads the open ones before every verdict. Under `set -u` a
          # prompt built before the assignment would kill the job.
          ADAPT_FINDINGS_FILE="$RUNNER_TEMP/merge-adapt-findings.txt"
          ADAPT_DIAGS_FILE="$RUNNER_TEMP/merge-adapt-referr-diags.txt"
          # Blocker lifecycle. A fixer agent (port / adapt) is TOLD about the
          # inbox only, and told to append; the workflow drains the inbox into
          # the open-blocker record after each fixer run, so a blocker a fixer
          # failed to fix is out of the prompt's reach by the next round. That
          # much is instruction-level, NOT enforced — both files sit under
          # $RUNNER_TEMP at paths the workflow itself discloses, and only the
          # review run is hash-checked against rewriting the record. The record
          # is retired ONLY by a fresh, independent review naming a blocker
          # verbatim in its verdict, which is what stops a genuinely-repaired
          # blocker from poisoning every later round. A still-open record can
          # never reach 'VERDICT: OK'.
          NEW_BLOCKERS_FILE="$RUNNER_TEMP/merge-new-blockers.txt"
          ADAPT_BLOCKERS_FILE="$RUNNER_TEMP/merge-open-blockers.txt"
          rm -f "$ADAPT_FINDINGS_FILE" "$ADAPT_DIAGS_FILE"
          # (BLOCKER-LIFECYCLE:drain) begin — extracted verbatim and executed by
          # scripts/nightly-merge-blockers.test.sh; keep self-contained.
          : > "$NEW_BLOCKERS_FILE"
          : > "$ADAPT_BLOCKERS_FILE"
          drain_new_blockers() {
            [ -s "$NEW_BLOCKERS_FILE" ] || return 0
            # Truncating the inbox is what makes a drop permanent, so nothing
            # may be truncated that was not understood. Any non-blank line
            # without the required prefix is a fixer writing the file some
            # other way — its content is unknowable, so the inbox is left
            # exactly as written and the night aborts rather than discard it.
            MALFORMED=$(grep -v '^[[:space:]]*$' "$NEW_BLOCKERS_FILE" | grep -v '^UNRESOLVED BLOCKER: ' || true)
            if [ -n "$MALFORMED" ]; then
              echo "::error::(MERGE-ADAPT) the blocker inbox holds line(s) without the required 'UNRESOLVED BLOCKER: ' prefix — refusing to drain, because truncating it would discard them. Inbox left intact. Baseline untouched."
              printf '%s\n' "$MALFORMED"
              exit 1
            fi
            grep '^UNRESOLVED BLOCKER: ' "$NEW_BLOCKERS_FILE" >> "$ADAPT_BLOCKERS_FILE" || true
            : > "$NEW_BLOCKERS_FILE"
            echo "(MERGE-ADAPT) open unresolved blockers after this run:"
            cat "$ADAPT_BLOCKERS_FILE"
          }
          # (BLOCKER-LIFECYCLE:drain) end
          HEAD_BEFORE_PORT=$(git rev-parse HEAD)
          # The index tree as it stands AFTER conflict resolution and BEFORE the
          # port agent runs. Diffing the port's result against the MERGE would
          # report upstream's entire delta as the agent's work; against this
          # tree it reports exactly what the agent changed.
          PORT_TREE_BEFORE=$(git write-tree)
          PORT_PROMPT="IMPORTANT: Do NOT enter plan mode. You are inside a git repository holding a staged, uncommitted merge of upstream superset tag ${NEWTAG} into our Windows-ARM64 fork. The previous upstream baseline is ${BASE}. ${BASE_TREE_NOTE} Your job is to find fork-owned files listed in ${FORK_DELTA_FILE} that reference upstream APIs, symbols, modules, collections, or providers that CHANGED between those tags — renamed/deleted/moved exports, changed signatures, removed collections/providers — and PORT the fork code to upstream's new API and intent so every fork feature keeps working. Where both upstream trees exist, use read-only commands such as 'git diff refs/upstream-tags/${BASE} refs/upstream-tags/${NEWTAG} -- <path>', 'git show', and grep to understand the refactor. If upstream renamed or privatized an export the fork imports, rewire the fork call site to the new mechanism or deliberately re-export the required mechanism; if upstream deleted a collection the fork queries, migrate the fork query to upstream's replacement data source. Two READ-ONLY evidence lists come with the allowlist. ${DELETED_FORK_FILES_FILE} lists fork-owned files this merge DELETED; for each one decide from the FEATURES.md row text whether a fork feature still needs it. If it does, restore it with 'git show HEAD:<path> > <path>' — never 'git checkout' or 'git restore', which rewrite the merge — and then port it like any other fork file; if upstream deliberately replaced it, follow upstream and leave it deleted. ${ADDED_UPSTREAM_FILES_FILE} lists the files this merge ADDED, which is usually where upstream's replacement for something it removed now lives. Both lists are evidence only: neither authorises editing or restoring a path the rules below protect. Before you change or restore anything, READ the FEATURES.md row for every feature involved: ${FEATURES_ROW_RULE} HARD RULES: edit the files listed in ${FORK_DELTA_FILE}, plus any fork file you restore from ${DELETED_FORK_FILES_FILE}. You may go outside that set ONLY where it is genuinely required — to fix another PROVEN compile or parse failure, or to restore something a fork feature provably depends on — and never for the accepted non-gating tsc type debt this tree carries, which is not a blocker and must be left alone. Never edit .github/workflows/**; never change the version field of any package.json; never edit FEATURES.md or AGENTS.md, and never rename, reword or invent a gate marker code; never restore plugins/superset or any path or identifier that scripts/check-no-bundled-skills.mjs forbids, and never delete a WIDER plugins tree (packages/shared/src/plugins, the desktop Plugins route) to satisfy that gate; ${SKILLS_REMOVAL_RULE} never move or rename an existing file — port it where it stands; never add, widen or restyle user-visible UI, because a port restores the fork's existing behaviour and introduces no new surface and no new user choice; never delete a fork feature or weaken any FEATURES.md marker; prefer minimal, surgical ports; after editing each file run 'git add <file>'; do NOT commit; do NOT run git merge / checkout / restore; if nothing needs porting, change nothing and stop. If a REAL compile or parse failure REMAINS that you could not fix within those rules — including one the narrow exception above does not cover — never ignore it and never silence it by deleting a use, a call site, or any functionality: append one line describing it to the file at ${NEW_BLOCKERS_FILE}, starting with 'UNRESOLVED BLOCKER: ', so the later review and repair rounds pick it up. A failure you DID fix, inside the allowlist or under that exception, is resolved: never append a blocker line for it. Never read or write any other blocker file. Output nothing."
          run_claude "merge-adapt-port" "$PORT_PROMPT" || true
          if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE_PORT" ] || ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::(MERGE-ADAPT) the proactive port run committed or destroyed the merge state — refusing to trust it. Baseline untouched."
            exit 1
          fi
          assert_manifest_untampered
          # Stage first so a disobedient untracked workflow file enters the index;
          # --no-overlay can then drop it with the rest of the fork-owned tree.
          git add -A
          git checkout --no-overlay HEAD -- .github/workflows
          drain_new_blockers
          # (MERGE-PORT-CONTEXT) What the port pass ACTUALLY changed, measured
          # against the pre-port index tree, with the workflow dir already
          # restored and deliberately WITHOUT FORK_PATHSPEC — an edit outside
          # the allowlist is exactly what this has to catch. Such paths are the
          # narrow escape clause in use: permitted, named in the log, and handed
          # to the semantic review as evidence — never routed into the blocker
          # inbox, which stays reserved for breakage nobody fixed.
          PORT_CHANGED_FILE="$RUNNER_TEMP/merge-port-changed.txt"
          PORT_ALLOWED_FILE="$RUNNER_TEMP/merge-port-allowed.txt"
          PORT_OUTSIDE_FILE="$RUNNER_TEMP/merge-port-outside-list.txt"
          sorted_names --cached "$PORT_TREE_BEFORE" > "$PORT_CHANGED_FILE"
          cat "$FORK_DELTA_FILE" "$DELETED_FORK_FILES_FILE" \
            | LC_ALL=C sort -u > "$PORT_ALLOWED_FILE"
          LC_ALL=C comm -23 "$PORT_CHANGED_FILE" "$PORT_ALLOWED_FILE" > "$PORT_OUTSIDE_FILE"
          echo "(MERGE-ADAPT) files the proactive port pass changed ($(wc -l < "$PORT_CHANGED_FILE")):"
          cat "$PORT_CHANGED_FILE"
          if [ -s "$PORT_OUTSIDE_FILE" ]; then
            echo "::warning::(MERGE-ADAPT) the port pass changed $(wc -l < "$PORT_OUTSIDE_FILE") file(s) outside the porting allowlist and the restorable-deletion list — permitted only by the prompt's narrow escape clause. They are named below, and the semantic review reads this same list."
            cat "$PORT_OUTSIDE_FILE"
          fi
          echo "::endgroup::"

          # --- dependency-consistency gate + lock regen (LOCK-REGEN) ----------
          # The build installs --frozen-lockfile and electron-builder's
          # dependency traversal requires each workspace's DECLARED dep version
          # to be the one actually installed. A merge introduces two kinds of
          # drift that both kill the build ~25 min in (after a windows-arm64
          # runner spins up), not here:
          #   (1) a fork root `overrides` entry pins a package to a version
          #       DIFFERENT from the merged workspace pin (this is exactly how a
          #       stale {@mastra/core, mastracode} override broke every mastra
          #       bump: override forced 0.18.0, chat declared 0.18.1 ->
          #       electron-builder "production dependency not found 0.18.1"); and
          #   (2) the merge bumps a package.json dep but bun.lock still pins the
          #       old version (a stale frozen lock).
          # Catch (1) loud here (pure manifest analysis, platform-independent);
          # fix (2) by regenerating the lock with the build's exact bun version,
          # which ALSO fails loud if the merged manifests don't resolve or a pin
          # is age-blocked. Both run in this 2-min job, so the windows-arm64
          # build never spins up on a broken tree. We deliberately do NOT run a
          # full `--frozen-lockfile` install here: this is a linux runner, so a
          # platform-specific install/native-build quirk would be a false abort,
          # and after a successful --lockfile-only the lock is consistent with
          # the manifests by construction (same bun version the build uses).
          # Any failure below hard-aborts with the baseline untouched.
          echo "::group::dependency-consistency gate"
          node scripts/check-override-consistency.mjs
          echo "::endgroup::"

          run_lock_regen() {
            echo "::group::regenerate bun.lock to match merged manifests"
            export SUPERSET_POSTINSTALL_RUNNING=1
            LOCKLOG="$RUNNER_TEMP/bun-lockfile.log"
            set +e
            bun install --lockfile-only > "$LOCKLOG" 2>&1
            rc=$?
            set -e
            cat "$LOCKLOG"
            if [ "$rc" -ne 0 ]; then
              if grep -q "blocked by minimum-release-age" "$LOCKLOG"; then
                echo "::error::Lock regen blocked by bunfig minimumReleaseAge — an upstream dep pin in $NEWTAG is <72h old. This is a timing race, not a breakage: the nightly will succeed once the version ages past the gate (re-run after it ages, or wait for tomorrow's schedule). Baseline left untouched."
              else
                echo "::error::bun install --lockfile-only failed (rc=$rc) after merging $NEWTAG — the merged manifests don't resolve. Recovery: fix locally and re-baseline."
              fi
              return 1
            fi
            echo "::endgroup::"
          }
          if ! run_lock_regen; then
            exit 1
          fi

          # --- (REFERR-REPAIR) run the build's ReferenceError gate HERE and let
          # Opus repair what it catches, so an import-dropping conflict
          # resolution self-heals tonight instead of failing the build and
          # costing a red night + manual recovery (desktop-v1.15.1
          # useChangesTab incident: the resolver took upstream's rewritten
          # import block, kept the fork's JSX, dropped Button/Tooltip/cn).
          # Repair is scoped HARD to what the gate reports: cannot-find-name
          # diagnostics (additive fixes only) and TS2451 duplicate declarations
          # (the one narrow case where reconciling two declarations into one is
          # allowed, both intents preserved). Anything still dirty after 2
          # attempts aborts exactly as before (the build
          # would have rejected it anyway — this just moves the gate earlier
          # and adds a bounded fix loop). --ignore-scripts keeps the linux
          # install pure-JS resolution (no native/postinstall platform quirks,
          # the reason this job deliberately avoids a full install elsewhere).
          echo "::group::(REFERR-REPAIR) build-breaking typecheck gate + bounded AI repair"
          bun install --frozen-lockfile --ignore-scripts
          REFERRLOG="$RUNNER_TEMP/referr.log"
          run_referr_gate() {
            set +e
            node scripts/check-dangerous-diagnostics.mjs > "$REFERRLOG" 2>&1
            REFERR_RC=$?
            set -e
            cat "$REFERRLOG"
          }
          run_referr_gate
          # The repair agent must only EDIT the work tree — record the commit
          # state so an agent that disobeys "Do NOT commit" (advancing HEAD
          # and vacating the merge) is caught, not silently laundered into a
          # clean-looking tree.
          HEAD_BEFORE_REPAIR=$(git rev-parse HEAD)
          attempt=1
          while [ "$REFERR_RC" -ne 0 ] && [ $attempt -le 2 ]; do
            DIAGS=$(grep -F '(REFERR-GATE)' "$REFERRLOG" | head -40 || true)
            if [ -z "$DIAGS" ]; then
              # Gate failed WITHOUT naming diagnostics = the checker itself
              # broke (install/tsc infra). AI repair has nothing to act on.
              echo "::error::(REFERR-REPAIR) gate failed without diagnostics — checker infrastructure problem, not repairable. Log above. Baseline untouched."
              exit 1
            fi
            REPAIR_PROMPT="IMPORTANT: Do NOT enter plan mode. You are inside a git repository holding a staged, uncommitted merge of upstream superset tag ${NEWTAG}. The typecheck gate found build-breaking diagnostics. Diagnostics: ${DIAGS} — Fix ONLY these diagnostics, and ONLY in the files they name. Two kinds appear here, with different rules. (1) CANNOT FIND NAME (TS2304/TS2552/TS2662/TS2663/TS18004): identifiers that would throw ReferenceError at runtime, almost always imports dropped during conflict resolution. Fix these ONLY by ADDING code: add the missing import lines (match how the same symbols are imported elsewhere in this repo, e.g. @superset/ui/*) or restore the dropped declaration. Read the file's existing imports first and extend them — never add a second import of a symbol the file already imports, which would only trade this error for a duplicate-declaration one. (2) CANNOT REDECLARE BLOCK-SCOPED VARIABLE (TS2451): one name declared twice in one scope, which a merge produces when the fork and upstream each add their own copy of an import or a const. This is the ONE case where you may remove code, and only in this narrow way: reconcile the duplicates into a SINGLE declaration that preserves BOTH intents — every symbol either side imported, and the value the surviving declaration must hold — and leaves every existing use-site working unchanged. NEVER delete, comment out, or rewrite existing code, JSX, or use-sites to silence a diagnostic — removing the code that uses an identifier, or dropping one side of a duplicate whose symbols are still used, is feature loss and is forbidden. Do NOT touch any file not named in the diagnostics. After editing each file run 'git add <file>'. Do NOT commit. Output nothing."
            echo "::group::claude referr-repair attempt $attempt"
            run_claude "referr-repair" "$REPAIR_PROMPT" || true
            echo "::endgroup::"
            run_referr_gate
            attempt=$((attempt+1))
          done
          if [ "$REFERR_RC" -ne 0 ]; then
            echo "::error::(REFERR-REPAIR) build-breaking diagnostics persist after repair attempts — aborting (the build would reject this tree). Recovery: fix locally and re-baseline. Baseline untouched."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE_REPAIR" ] || ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::(REFERR-REPAIR) the repair run committed or destroyed the merge state — refusing to trust it. Baseline untouched."
            exit 1
          fi
          assert_manifest_untampered
          # Stage any repair edits NOW: the semantic review below reads the
          # STAGED diff ('git diff --cached'); an unstaged repair would be
          # invisible to the review yet still swept into the final commit's
          # 'git add -A' — reviewed tree and shipped tree must be identical.
          git add -A
          echo "::endgroup::"

          # --- feature-marker gate (FEATURES.md) ------------------------------
          # Run once after conflict/port/REFERR repair and again after EVERY
          # semantic adaptation. A repair that deletes fork code is never an
          # acceptable way to make a review or diagnostic go green.
          run_marker_gate() {
            echo "::group::feature-marker gate"
            rm -f "$RUNNER_TEMP/marker-missing"
            # read the fenced ```markers block: lines are "<token><TAB><glob-root>"
            # Guard the guard: an empty/renamed block would pass VACUOUSLY (zero
            # markers checked == zero missing). Fail loud instead.
            MARKER_LINES=$(awk '/^```markers$/{f=1;next} /^```$/{f=0} f' FEATURES.md)
            if ! printf '%s\n' "$MARKER_LINES" | grep -q '[^[:space:]]'; then
              echo "::error::FEATURES.md markers block is missing or empty — the marker gate would pass vacuously. Refusing to trust this merge."
              echo "::endgroup::"
              return 1
            fi
            printf '%s\n' "$MARKER_LINES" | while IFS=$'\t' read -r tok root; do
              [ -n "$tok" ] || continue
              if grep -rqsF -- "$tok" "$root" 2>/dev/null; then
                echo "  OK   $tok ($root)"
              else
                echo "::error::feature marker MISSING after merge: '$tok' under $root"
                echo missing >> "$RUNNER_TEMP/marker-missing"
              fi
            done
            echo "::endgroup::"
            if [ -f "$RUNNER_TEMP/marker-missing" ]; then
              echo "::error::A feature was dropped by the $NEWTAG merge/adaptation — rejecting. Recovery: fix locally and re-baseline."
              return 1
            fi
          }
          if ! run_marker_gate; then
            exit 1
          fi
          if ! node scripts/check-no-bundled-skills.mjs; then
            echo "::error::(NO-BUNDLED-SKILLS) the merged tree restored retired Superset skills. Baseline untouched."
            exit 1
          fi

          # --- (MERGE-SEMANTIC-GATE) bounded review/adapt/re-verify loop -------
          # The marker gate only proves feature TOKENS still exist, and the
          # build's (REFERR-GATE) only catches cannot-find-name and duplicate-
          # declaration diagnostics. A
          # cleanly-merging upstream hunk can still SEMANTICALLY break a fork
          # feature with zero conflicts — v1.14.2 dropped sidebar state fields,
          # while v1.16.0 deleted/privatized APIs still used by fork-only files.
          # (MERGE-ADAPT) first ports likely call sites proactively; this loop is
          # the fresh-eyes backstop. Each BREAKAGE verdict may drive one surgical
          # adaptation, followed by deterministic gates and a brand-new review.
          # Five review rounds / four repairs is the hard bound. No verdict,
          # reviewer mutation, deleted marker, or final BREAKAGE fails closed.
          # The bound is rounds, NOT time: the job keeps GitHub's default
          # 360-minute cap, so a slow night can die at the cap mid-round
          # instead — red, baseline untouched, nothing unreviewed pushed.
          REVIEW_FILE="$RUNNER_TEMP/merge-review.txt"
          REVIEW_PROMPT="IMPORTANT: Do NOT enter plan mode. You are reviewing an ALREADY-RESOLVED, staged, uncommitted merge of upstream superset tag ${NEWTAG} into our Windows-ARM64 fork. Your ONLY job is to decide whether the merged result SEMANTICALLY breaks any fork feature. Steps: (1) Read FEATURES.md — the fork feature manifest (feature descriptions + marker tokens). (2) Run 'git --no-pager diff --cached --name-only' to list every file the merge changed. (3) For each changed file that participates in a fork feature — it contains a FEATURES.md marker token, or it is in the blast radius of one (e.g. a projection/select/mapping that a feature's fields flow through, a component a feature's props pass through, a hook a feature's guard lives in) — read the staged diff ('git --no-pager diff --cached -- <file>') AND the surrounding file content, and verify the fork behaviour still works end-to-end: fork-added fields still projected/carried, fork branches and guards still reachable, fork props still passed, fork call sites still invoked. An upstream refactor that preserves behaviour is fine; flag only real breakage. (4) Write your verdict to the file at ${REVIEW_FILE} — the FIRST line must be exactly 'VERDICT: OK' or 'VERDICT: BREAKAGE'; for BREAKAGE add one line per finding: '<file> — <feature/marker> — <what broke>'. (5) If the file at ${WFDELTA_FILE} is non-empty, read it — it is upstream's CI/workflow delta we deliberately did NOT merge (.github/workflows is fork-owned). If it moves BUILD-RELEVANT logic into upstream CI (a codegen/generate step, a newly required env var, a packaging/signing step) that our fork's own build workflow would now silently miss, append one line per item after the verdict: 'CI-NOTE: <what upstream CI now does that the fork build may need>'. CI-NOTEs alone never change the verdict. (6) Before you decide, read the file at ${ADAPT_FINDINGS_FILE} if it exists and is non-empty, and the file at ${ADAPT_DIAGS_FILE} if it exists and is non-empty. They hold the findings and deterministic gate diagnostics a PREVIOUS adaptation round was told to fix. Check every entry against the CURRENT tree. You may NOT return 'VERDICT: OK' while any of them is still unresolved. (7) Read the file at ${ADAPT_BLOCKERS_FILE} if it is non-empty — one line per blocker an earlier round recorded as unresolved, each starting with 'UNRESOLVED BLOCKER: '. Verify EVERY line against the CURRENT tree yourself. For each one you PROVE is now fixed (or was never real), append a line 'BLOCKER RESOLVED: <that line copied verbatim, prefix included>'; the workflow retires exactly the lines you echo verbatim and nothing else, so a paraphrase leaves the blocker open. Never guess, and never retire a line you did not check. Any line you do not retire is still open, and you may NOT return 'VERDICT: OK' while one is open — an open BLOCKER is BREAKAGE and must be listed as a finding. A BLOCKER means an actual compile or parse failure, or a diagnostic the configured gates fail on; the accepted non-gating tsc type debt this tree carries is NOT a blocker and must never be reported as one. (8) Read the file at ${PORT_OUTSIDE_FILE} if it exists and is non-empty — it lists the files the proactive port pass changed OUTSIDE its own allowlist, which its prompt permits only as a PROVEN fix or as a restoration a fork feature depends on. Give each of those files the same end-to-end check as step (3); one that is neither — new surface, a widened rule, or a deletion that silences an error instead of fixing it — is a finding. Rules: do NOT edit ANY repository file; the ONLY file you may write is ${REVIEW_FILE} — never write to the findings, diagnostics or blocker files; do NOT run git add / commit / checkout / merge / restore; only read files, run read-only git diff/log/show commands, and write the verdict file. You are a READ-ONLY reviewer, and the workflow fingerprints the work tree before and after this run: ANY change to it, source or generated, aborts the whole night. So never run a command that writes the checkout — no 'lingui extract' and no 'lingui compile', no 'bun install' / 'bun add' / 'bunx', no build, test, codegen, lint or formatter command, and no git command that writes the index or the worktree. Nothing in this review needs one; read the code instead. The Lingui catalogs are deliberately NOT regenerated yet — the workflow re-extracts, backfills and compiles them AFTER this review ((I18N-UPSTREAM-BACKFILL)) — so a catalog that looks stale, or that carries upstream strings with an empty translation, is EXPECTED here and is never a finding. Real i18n breakage still is a finding: a fork string whose Lingui macro usage the merge broke, a locale missing from SUPPORTED_LOCALES, or a dead @superset/i18n import. Output nothing else."
          # The reviewer is read-only, and these three fingerprints are the
          # proof: the porcelain status (paths + index state, untracked files
          # listed one by one), the worktree content against HEAD, and the
          # index content against HEAD. Status alone is content-blind — a write
          # over a file that ALREADY shows as M leaves its status line
          # byte-identical, which is exactly what a stray 'lingui extract' over
          # a staged catalog looks like — and the --cached hash stops an index
          # change hiding behind a matching worktree. The status snapshots are
          # kept as files so a violation can name the paths that moved without
          # dumping any content.
          review_status_snapshot() {
            git status --porcelain=v1 --untracked-files=all > "$1"
          }
          review_content_hash() {
            git --no-pager diff --no-ext-diff --no-textconv --binary "$@" HEAD | sha256sum
          }
          # Round N runs a review; round MAX aborts BEFORE adapting, so the
          # last thing that ever happens is a fresh, independent review of the
          # tree — 5 reviews, 4 repairs.
          MAX_REVIEW_ROUNDS=5
          round=1
          while [ $round -le $MAX_REVIEW_ROUNDS ]; do
            echo "::group::semantic review round $round"
            # Never let an earlier round's verdict satisfy this round.
            rm -f "$REVIEW_FILE"
            # The reviewer must not modify the tree; snapshot the work-tree state
            # and refuse to continue if the review run changed ANYTHING.
            STATUS_BEFORE_FILE="$RUNNER_TEMP/review-status-before-round-$round.txt"
            STATUS_AFTER_FILE="$RUNNER_TEMP/review-status-after-round-$round.txt"
            review_status_snapshot "$STATUS_BEFORE_FILE"
            WORKTREE_BEFORE=$(review_content_hash)
            INDEX_BEFORE=$(review_content_hash --cached)
            BLOCKERS_BEFORE=$(sha256sum < "$ADAPT_BLOCKERS_FILE")
            attempt=1
            while [ $attempt -le 2 ]; do
              echo "::group::claude review attempt $attempt"
              run_claude "review-round-$round" "$REVIEW_PROMPT" || true
              echo "::endgroup::"
              if [ -s "$REVIEW_FILE" ] && head -1 "$REVIEW_FILE" | grep -qE '^VERDICT: (OK|BREAKAGE)$'; then break; fi
              attempt=$((attempt+1))
            done
            review_status_snapshot "$STATUS_AFTER_FILE"
            WORKTREE_AFTER=$(review_content_hash)
            INDEX_AFTER=$(review_content_hash --cached)
            BLOCKERS_AFTER=$(sha256sum < "$ADAPT_BLOCKERS_FILE")
            if ! cmp -s "$STATUS_BEFORE_FILE" "$STATUS_AFTER_FILE" \
              || [ "$WORKTREE_BEFORE" != "$WORKTREE_AFTER" ] \
              || [ "$INDEX_BEFORE" != "$INDEX_AFTER" ]; then
              echo "--- review round $round changed the tree: status snapshot diff (paths only) ---"
              STATUS_DIFF_RC=0
              diff -u "$STATUS_BEFORE_FILE" "$STATUS_AFTER_FILE" || STATUS_DIFF_RC=$?
              if [ "$STATUS_DIFF_RC" -gt 1 ]; then
                echo "::error::(MERGE-SEMANTIC-GATE) could not diff the review status snapshots (diff exited $STATUS_DIFF_RC) — reporting the mutation anyway."
              fi
              echo "--- worktree against HEAD after the review (stat only; an index-only change may not show here — the index hash above is what caught it) ---"
              git --no-pager diff --stat HEAD
              echo "::error::(MERGE-SEMANTIC-GATE) the review run modified the work tree — refusing to trust or commit it. Baseline untouched."
              exit 1
            fi
            if [ "$BLOCKERS_BEFORE" != "$BLOCKERS_AFTER" ]; then
              echo "::error::(MERGE-SEMANTIC-GATE) the review run rewrote the open-blocker record instead of naming retirements in its verdict — refusing to trust it. Baseline untouched."
              exit 1
            fi
            if ! [ -s "$REVIEW_FILE" ] || ! head -1 "$REVIEW_FILE" | grep -qE '^VERDICT: (OK|BREAKAGE)$'; then
              echo "::error::(MERGE-SEMANTIC-GATE) no parsable review verdict for $NEWTAG in round $round — refusing to ship an UNREVIEWED merge (fail closed). Baseline untouched."
              exit 1
            fi
            echo "--- review verdict ---"
            cat "$REVIEW_FILE"
            # (BLOCKER-LIFECYCLE:retire-gate) begin — extracted verbatim and
            # executed by scripts/nightly-merge-blockers.test.sh; keep self-contained.
            # Retire only the open blockers THIS review echoed back verbatim
            # after proving them fixed, then refuse any OK that still leaves one
            # open. Retirement runs before the verdict is judged so a BREAKAGE
            # round can clear a repaired blocker while flagging something else.
            RETIRED_FILE="$RUNNER_TEMP/merge-retired-blockers.txt"
            sed -n 's/^BLOCKER RESOLVED: //p' "$REVIEW_FILE" > "$RETIRED_FILE"
            if [ -s "$RETIRED_FILE" ] && [ -s "$ADAPT_BLOCKERS_FILE" ]; then
              grep -vxF -f "$RETIRED_FILE" "$ADAPT_BLOCKERS_FILE" > "$ADAPT_BLOCKERS_FILE.keep" || true
              mv "$ADAPT_BLOCKERS_FILE.keep" "$ADAPT_BLOCKERS_FILE"
              echo "(MERGE-ADAPT) blockers this review verified as fixed and retired:"
              cat "$RETIRED_FILE"
            fi
            if head -1 "$REVIEW_FILE" | grep -q '^VERDICT: OK$'; then
              if [ -s "$ADAPT_DIAGS_FILE" ]; then
                echo "::error::(MERGE-ADAPT) semantic review is OK but the prior adaptation left deterministic build-breaking diagnostics — refusing to ship. Baseline untouched."
                exit 1
              fi
              if [ -s "$ADAPT_BLOCKERS_FILE" ]; then
                echo "::error::(MERGE-ADAPT) semantic review is OK but blockers recorded by an earlier round are still open and unretired — refusing to ship. Baseline untouched."
                cat "$ADAPT_BLOCKERS_FILE"
                exit 1
              fi
              echo "::endgroup::"
              break
            fi
            # (BLOCKER-LIFECYCLE:retire-gate) end
            echo "::endgroup::"

            if [ $round -eq $MAX_REVIEW_ROUNDS ]; then
              echo "::error::(MERGE-SEMANTIC-GATE) Opus still found fork-feature breakage in the $NEWTAG merge after $MAX_REVIEW_ROUNDS reviews — rejecting. Findings above. Recovery: fix locally and re-baseline."
              exit 1
            fi

            # Pass every finding (all verdict lines after line 1, minus this
            # round's retirements) to a separate repair agent, plus every
            # blocker still open and any build-breaking diagnostics the previous
            # adaptation left. The findings file is scratch, rebuilt each round;
            # the open-blocker record is what survives, so a round whose verdict
            # never mentions an older blocker can no longer drop it.
            # (BLOCKER-LIFECYCLE:findings) begin — extracted verbatim and
            # executed by scripts/nightly-merge-blockers.test.sh; keep self-contained.
            tail -n +2 "$REVIEW_FILE" | grep -v '^BLOCKER RESOLVED: ' > "$ADAPT_FINDINGS_FILE" || true
            if [ -s "$ADAPT_BLOCKERS_FILE" ]; then
              {
                echo
                echo "BLOCKERS RECORDED BY EARLIER ROUNDS AND STILL OPEN:"
                cat "$ADAPT_BLOCKERS_FILE"
              } >> "$ADAPT_FINDINGS_FILE"
            fi
            if [ -s "$ADAPT_DIAGS_FILE" ]; then
              {
                echo
                echo "DETERMINISTIC REFERR-GATE DIAGNOSTICS FROM THE PRIOR ADAPTATION:"
                cat "$ADAPT_DIAGS_FILE"
              } >> "$ADAPT_FINDINGS_FILE"
            fi
            # (BLOCKER-LIFECYCLE:findings) end
            FINDINGS=$(cat "$ADAPT_FINDINGS_FILE")
            echo "::group::(MERGE-ADAPT) repair round $round"
            HEAD_BEFORE_ADAPT=$(git rev-parse HEAD)
            PACKAGE_JSON_BEFORE_ADAPT=$(git diff HEAD -- package.json '**/package.json' | sha256sum)
            ADAPT_PROMPT="IMPORTANT: Do NOT enter plan mode. You are inside a git repository holding a staged, uncommitted merge of upstream superset tag ${NEWTAG} into our Windows-ARM64 fork. An independent semantic review found the fork-feature breakages below. Fix EACH finding by porting the fork code to upstream's new API and intent. You may use read-only git commands such as 'git diff refs/upstream-tags/${BASE} refs/upstream-tags/${NEWTAG} -- <path>' and 'git show' plus grep to understand the upstream refactor. FINDINGS: ${FINDINGS} Those findings may include deterministic gate diagnostics and blockers still open from earlier rounds as well as review findings. A BLOCKER means an actual compile or parse failure, or a diagnostic the configured gates fail on — the accepted non-gating tsc type debt this tree carries is NOT a blocker and must be left alone. Fix EVERY blocker named above in this one pass, not only the first. If fixing one exposes another PROVEN blocker in a file the findings do not name, you may fix that too, under the same hard rules, when it is genuinely required for the named ones to resolve. If a real blocker cannot be fixed within these rules, leave the code alone and append one line describing it to the file at ${NEW_BLOCKERS_FILE}, starting with 'UNRESOLVED BLOCKER: ' — never ignore it and never silence it. That file is append-only and is the ONLY blocker file you may write: never rewrite or delete a line anywhere to claim a fix, and do NOT re-report a blocker you actually fixed — the next independent review re-checks every open blocker against the tree and retires the ones it can prove are gone. HARD RULES: never delete, disable, comment out, or stub a fork feature to silence a finding; never weaken, remove or rename a marker token tracked in FEATURES.md; ${SKILLS_REMOVAL_RULE} never change the version field of any package.json; never touch .github/workflows/**; edit only files needed for these findings and their blockers; prefer minimal, surgical ports; after editing each file run 'git add <file>'; do NOT commit. Output nothing."
            run_claude "merge-adapt-round-$round" "$ADAPT_PROMPT" || true
            if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE_ADAPT" ] || ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::(MERGE-ADAPT) repair round $round committed or destroyed the merge state — refusing to trust it. Baseline untouched."
              exit 1
            fi
            assert_manifest_untampered
            # Stage first so --no-overlay also drops untracked workflow files.
            git add -A
            git checkout --no-overlay HEAD -- .github/workflows
            drain_new_blockers
            PACKAGE_JSON_AFTER_ADAPT=$(git diff HEAD -- package.json '**/package.json' | sha256sum)
            if [ "$PACKAGE_JSON_BEFORE_ADAPT" != "$PACKAGE_JSON_AFTER_ADAPT" ]; then
              if ! run_lock_regen; then
                exit 1
              fi
              git add bun.lock
            fi
            run_referr_gate
            if ! run_marker_gate; then
              echo "::error::(MERGE-ADAPT) repair round $round removed a fork feature marker — no further repair is acceptable. Baseline untouched."
              exit 1
            fi
            if ! node scripts/check-no-bundled-skills.mjs; then
              echo "::error::(MERGE-ADAPT) repair round $round restored retired Superset skills. Baseline untouched."
              exit 1
            fi
            rm -f "$ADAPT_DIAGS_FILE"
            if [ "$REFERR_RC" -ne 0 ]; then
              DIAGS=$(grep -F '(REFERR-GATE)' "$REFERRLOG" | head -40 || true)
              if [ -z "$DIAGS" ]; then
                echo "::error::(MERGE-ADAPT) repair made the typecheck gate fail without actionable diagnostics — aborting. Baseline untouched."
                exit 1
              fi
              if [ $round -ge $((MAX_REVIEW_ROUNDS - 1)) ]; then
                echo "::error::(MERGE-ADAPT) the final available repair introduced/preserved build-breaking diagnostics — aborting. Baseline untouched."
                exit 1
              fi
              printf '%s\n' "$DIAGS" > "$ADAPT_DIAGS_FILE"
              echo "(MERGE-ADAPT) carrying build-breaking diagnostics into the next repair round."
            fi
            echo "::endgroup::"
            round=$((round+1))
          done

          # --- (I18N-UPSTREAM-BACKFILL) bring the Lingui catalogs back in step -
          # The build's (I18N-CATALOG-GATE) re-extracts and fails on any diff, so
          # the catalogs have to be right in the commit made below — after the
          # last AI pass, so a string an adapt round touched is caught too.
          # Extraction adds every new upstream string to all sixteen locales with
          # an empty msgstr and `compile --strict` rejects that, which is what
          # turned one new upstream word into a red night. The backfill copies the
          # translation a pinned donor already ships for that exact message: the
          # fork's own pre-merge commit first, then the tag being merged. Both are
          # pinned to a commit so a moved tag cannot change what gets copied. The
          # fork comes first because a fork-only string is one upstream has never
          # seen and can never fill, while the fork's own catalogs carry it in all
          # sixteen languages. It invents nothing and overwrites no translation
          # the merged catalogs already carry; a string NEITHER donor has fails
          # here, loudly, with the baseline untouched. The second extract proves
          # the filled catalogs are what extraction produces, not a state only
          # this step can reach.
          echo "::group::(I18N-UPSTREAM-BACKFILL) regenerate + backfill Lingui catalogs"
          UPSTREAM_SHA=$(git rev-parse --verify "refs/upstream-tags/$NEWTAG^{commit}")
          # The merge is still uncommitted, so HEAD must be the commit pinned
          # before it. If anything moved it, the fork donor would no longer be the
          # pre-merge catalogs this run set out to read — stop instead of guessing.
          HEAD_NOW=$(git rev-parse --verify HEAD^{commit})
          if [ "$HEAD_NOW" != "$FORK_HEAD" ]; then
            echo "::error::(I18N-UPSTREAM-BACKFILL) HEAD moved during the merge ($FORK_HEAD -> $HEAD_NOW) — refusing to backfill from a commit that is not the pinned pre-merge fork. Baseline untouched."
            exit 1
          fi
          (cd packages/i18n && node_modules/.bin/lingui extract --clean --overwrite --workers 1)
          bun packages/i18n/scripts/backfill-upstream-translations.ts --fork="$FORK_HEAD" --upstream="$UPSTREAM_SHA"
          (cd packages/i18n && node_modules/.bin/lingui extract --clean --overwrite --workers 1)
          (cd packages/i18n && node_modules/.bin/lingui compile --strict --workers 1)
          echo "::endgroup::"

          # --- record new baseline + commit the merge -------------------------
          # (NIGHTLY-INTEGRITY) The release tag is derived SOLELY from
          # apps/desktop/package.json by the build — if the merged version
          # doesn't match the tag being merged, the build would delete and
          # rebuild the WRONG release (e.g. a bad package.json conflict
          # resolution keeping 1.14.3 while merging desktop-v1.15.0), then
          # advance the baseline past a version that no longer has a correct
          # release. Assert the invariant here instead.
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "desktop-v${VERSION}" != "$NEWTAG" ]; then
            echo "::error::merged apps/desktop/package.json version ($VERSION) does not match $NEWTAG — bad version resolution; refusing to commit. Baseline untouched."
            exit 1
          fi
          # (WORKFLOW-FORK-OWNED) postcondition: the tree about to be committed
          # must contain ZERO workflow-dir changes — not from the merge, not
          # from the AI resolver, not from the review run. The restore step
          # above is the mechanism; this is the proof (a workflow delta would be
          # rejected by the push anyway — fail here, loud, with the baseline
          # untouched).
          if [ -n "$(git status --porcelain=v1 --untracked-files=all -- .github/workflows)" ]; then
            echo "::error::(WORKFLOW-FORK-OWNED) .github/workflows differs from HEAD after resolve/review — refusing to commit:"
            git status --porcelain=v1 --untracked-files=all -- .github/workflows
            exit 1
          fi
          assert_manifest_untampered
          printf '%s\n' "$NEWTAG" > .fork/upstream-baseline.txt
          git add -A
          git commit -m "merge upstream ${NEWTAG}" -m "Auto-merged by nightly-merge; conflicts resolved and clean refactors ported by Opus where needed; all FEATURES.md markers verified present; merged delta passed the bounded (MERGE-SEMANTIC-GATE)/(MERGE-ADAPT) review loop."
          # (I18N-UPSTREAM-BACKFILL) The build runs this same gate on the
          # candidate. Run it here too, so a catalog that does not match its
          # source fails the merge job with the baseline untouched instead of
          # burning a build — and so a rehearsal proves it. It refuses to run on a
          # dirty catalog tree, which is why it comes after the commit.
          bash scripts/check-i18n-catalogs.sh
          # (CANDIDATE-IDEMPOTENT-PUSH) The candidate is a disposable CI branch:
          # re-derived from main each run, consumed by `build`, deleted by
          # `advance` ON SUCCESS only. A FAILED build never reaches `advance`, so
          # it strands the candidate on the remote. The next night re-merges the
          # SAME upstream version into a NEW commit (AI conflict resolution is
          # non-deterministic AND main may have advanced), whose history diverges
          # from the stale branch — a plain push is then rejected non-fast-forward
          # and EVERY subsequent nightly deadlocks on that stale ref. Drop any
          # stale remote copy first so the push is always clean. This is pure CI
          # scratch (never a feature/history branch), so overwriting it is safe;
          # we delete-then-push rather than --force a real branch.
          # (REHEARSAL) Everything above — merge, resolver, repair, every
          # gate, even the local merge commit — ran for real; stop before
          # anything leaves this runner. This is the on-demand emulation of
          # the overnight run: after ANY change to this workflow, dispatch
          # rehearse=true (+ force_tag / rehearse_base to replay a past
          # night) and get tonight's answer today, with zero side effects.
          if [ "$REHEARSE" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            {
              echo "## REHEARSAL PASSED — $NEWTAG"
              echo "Merge + conflict resolution + proactive (MERGE-ADAPT) port + dependency/REFERR/marker gates + bounded semantic review/adapt loop all green."
              echo "Merge commit (local only, discarded): $(git rev-parse HEAD)"
              echo "No candidate pushed, no build, no advance, baseline untouched."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin --delete "$CAND" 2>/dev/null || true
          git push origin "$CAND"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "newtag=$NEWTAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          # (NIGHTLY-INTEGRITY) build + advance consume this immutable SHA, not
          # the mutable branch name — a replaced candidate can't be built or
          # advanced unnoticed.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Merged $NEWTAG -> candidate $CAND @ $(git rev-parse HEAD) (version $VERSION). Building next."

  build:
    needs: merge
    # false = one of the three no-ops: already at baseline, a rehearsal, or an
    # (AI-UNAVAILABLE) night that merged, built and published nothing.
    if: needs.merge.outputs.should_build == 'true'
    # FOOTGUN: never add continue-on-error to THIS job — advance's implicit
    # success() gate reads this job's real result; continue-on-error would
    # mask a red build as success and let advance ship it.
    uses: ./.github/workflows/build-arm64.yml
    with:
      # (NIGHTLY-INTEGRITY) build the exact merge commit, immune to candidate-
      # branch mutation between jobs.
      ref: ${{ needs.merge.outputs.sha }}
      publish: true
      # (BUILD-REPAIR) AI repairs land on the candidate; advance verifies the
      # built sha descends from the gated merge commit before touching main.
      repair_branch: ${{ needs.merge.outputs.candidate }}
    secrets: inherit

  advance:
    needs: [merge, build]
    if: needs.merge.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # (BUILD-REPAIR) a repair commit may touch .github/workflows; pushing
          # that to main needs the workflow-scoped PAT. Falls back to
          # GITHUB_TOKEN when no workflow files changed.
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' && secrets.WORKFLOW_PUSH_TOKEN || github.token }}
      - name: Fast-forward main to the verified candidate + clean up
        shell: bash
        run: |
          set -euo pipefail
          CAND='${{ needs.merge.outputs.candidate }}'
          SHA='${{ needs.merge.outputs.sha }}'
          BUILT='${{ needs.build.outputs.built_sha }}'
          [ -n "$BUILT" ] || { echo "::error::build reported success but no built_sha output — refusing to advance."; exit 1; }
          git fetch origin "$CAND"
          # (NIGHTLY-INTEGRITY) advance ONLY what was gated + built: the
          # candidate tip must be exactly the sha the successful attempt built,
          # and that sha must descend from the gated merge commit (equal when
          # no (BUILD-REPAIR) rounds ran).
          if [ "$(git rev-parse FETCH_HEAD)" != "$BUILT" ]; then
            echo "::error::candidate $CAND tip is $(git rev-parse FETCH_HEAD), expected built sha $BUILT — another run interfered; refusing to advance main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" "$BUILT"; then
            echo "::error::built sha $BUILT does not descend from the gated merge commit $SHA — refusing to advance main."
            exit 1
          fi
          # The candidate is main + the merge commit (+ any repair commits), so
          # this is a fast-forward.
          git push origin "$BUILT:refs/heads/main"
          git push origin --delete "$CAND"
          echo "Baseline advanced to ${{ needs.merge.outputs.newtag }} at $BUILT; Release published by the build job."
